  gl.disable(gl.BLEND);

  // ---- 1. scene → HDR target (with previous frame folded in for trails) ----
  pass(progScene, dstFbo, fbW, fbH);
  gl.uniform2f(U.scene.uRes, fbW, fbH);
  gl.uniform1f(U.scene.uTime, t*(reduced?0.4:1));
  gl.uniform1f(U.scene.uBass, A.bass);
  gl.uniform1f(U.scene.uMid, A.mid);
  gl.uniform1f(U.scene.uTreb, A.treb);
  gl.uniform1f(U.scene.uEnergy, A.energy);
  gl.uniform1f(U.scene.uBeat, ST.beatPulse);
  gl.uniform1f(U.scene.uDown, ST.downPulse);
  gl.uniform1i(U.scene.uScene, ST.scene);
  gl.uniform3fv(U.scene.uColA, hexRGB(pal[1]));
  gl.uniform3fv(U.scene.uColB, hexRGB(pal[2]));
  gl.uniform3fv(U.scene.uColC, hexRGB(pal[3]));
  gl.uniform1f(U.scene.uQual, (q.adapt && adaptK < 0.72) ? Math.max(0, q.qual-1) : q.qual);
  gl.uniform1f(U.scene.uHdr, HDR ? 14.0 : 1.6);
  bindTex(0, srcTex, U.scene.uPrev);
  gl.uniform1f(U.scene.uTrail, reduced ? 0.34 : (0.52 + A.bass*0.30));
  drawQuad();

  // ---- 2..4. bloom: extract → downsample chain → additive tent upsample ----
  if(MIPS.length){
    const m0 = MIPS[0];
    pass(progBright, m0.fbo, m0.w, m0.h);
    gl.uniform2f(U.bright.uTexel, 1/fbW, 1/fbH);
    gl.uniform1f(U.bright.uThresh, HDR ? BLOOM.thresh : 0.78);
    gl.uniform1f(U.bright.uKnee, BLOOM.knee);
    bindTex(0, outTex, U.bright.uTex);
    drawQuad();

    for(let i=1;i<MIPS.length;i++){
      const a = MIPS[i-1], b = MIPS[i];
      pass(progDown, b.fbo, b.w, b.h);
      gl.uniform2f(U.down.uTexel, 1/a.w, 1/a.h);
      bindTex(0, a.tex, U.down.uTex);
      drawQuad();
    }

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    for(let i=MIPS.length-1;i>0;i--){
      const a = MIPS[i], b = MIPS[i-1];
      pass(progUp, b.fbo, b.w, b.h);
      gl.uniform2f(U.up.uTexel, 1/a.w, 1/a.h);
      gl.uniform1f(U.up.uAmt, 0.82);
      bindTex(0, a.tex, U.up.uTex);
      drawQuad();
    }
    gl.disable(gl.BLEND);
  }

  // ---- 5. composite → screen ----
  pass(progFinal, null, RS.cw, RS.ch);
  gl.uniform2f(U.final.uRes, RS.cw, RS.ch);
  gl.uniform2f(U.final.uSrcTexel, 1/fbW, 1/fbH);
  gl.uniform1f(U.final.uTimeG, (t*60)%997);
  gl.uniform1f(U.final.uBeat, ST.beatPulse);
  gl.uniform1f(U.final.uDown, ST.downPulse);
  gl.uniform1f(U.final.uAber, A.treb);
  gl.uniform1f(U.final.uBloomAmt, MIPS.length ? BLOOM.amt : 0.0);
  // sharpen only pays for itself when the internal buffer is below the canvas
  gl.uniform1f(U.final.uSharp, Math.max(0, Math.min(0.42, (1 - fbW/RS.cw) * 1.5)));
  gl.uniform1f(U.final.uGrain, RS.ch > 1600 ? 0.020 : 0.032);
  gl.uniform1f(U.final.uExpo, HDR ? 1.30 : 1.35);
  bindTex(0, outTex, U.final.uTex);
  bindTex(1, MIPS.length ? MIPS[0].tex : outTex, U.final.uBloom);
  drawQuad();
}

// ---------- adaptive resolution governor (AUTO tier only) ----------
const PERF = {ema:16.7, up:0, down:0, fps:60};
function govern(dtMs){
  PERF.ema = PERF.ema*0.92 + dtMs*0.08;
  PERF.fps = 1000/Math.max(PERF.ema, 1);
  if(!QUALITY[QI].adapt) return;
  if(PERF.ema > 21.5){ PERF.down++; PERF.up = 0; }
  else if(PERF.ema < 14.2){ PERF.up++; PERF.down = 0; }
  else { PERF.up = 0; PERF.down = 0; }
  if(PERF.down > 45 && adaptK > 0.50){
    adaptK = Math.max(0.50, adaptK - 0.08); PERF.down = PERF.up = 0; glResize();
  } else if(PERF.up > 260 && adaptK < 1.18){
    adaptK = Math.min(1.18, adaptK + 0.06); PERF.down = PERF.up = 0; glResize();
  }
}

// ============================================================
// AUDIO — mic or demo, band analysis, auto BPM detect
// ============================================================
let AC=null, analyser=null, freqD=null;
let micStream=null, micSrc=null, demo=null;

function ensureAC(){
  if(!AC){
    AC = new (window.AudioContext||window.webkitAudioContext)();
    analyser = AC.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.72;
    freqD = new Uint8Array(analyser.frequencyBinCount);
  }
  if(AC.state==='suspended') AC.resume();
}
function stopSources(){
  if(demo){ demo.stop(); demo=null; }
  if(micSrc){ try{micSrc.disconnect();}catch(e){} micSrc=null; }
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
  try{ analyser.disconnect(); }catch(e){}
}
async function startMic(){
  ensureAC(); stopSources();
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){ toast('MIC BLOCKED — CHECK PERMISSIONS'); return false; }
  micSrc = AC.createMediaStreamSource(micStream);
  micSrc.connect(analyser); // analyser only — no monitor loop, no feedback
  ST.source='mic'; ST.running=true;
  srcUI(); toast('LIVE ROOM AUDIO'); return true;
}
function startDemo(){
  ensureAC(); stopSources();
  demo = makeDemo();
  ST.source='demo'; ST.running=true;
  if(ST.tempoMode==='tap'){ /* keep tapped */ } else { ST.bpm=96; reanchor(performance.now()); }
  srcUI(); toast('DEMO BEAT · 96 BPM');
}
function makeDemo(){
  const bpm=96, spb=60/bpm;
  const bus=AC.createGain(); bus.gain.value=.9;
  const out=AC.createGain(); out.gain.value=.8;
  bus.connect(analyser); analyser.connect(out); out.connect(AC.destination);
  let next=AC.currentTime+.08, step=0, timer=null, alive=true;
  const bassLine=[41.2,41.2,49,41.2,41.2,55,49,36.7];
  function kick(t){
    const o=AC.createOscillator(), g=AC.createGain();
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+.11);
    g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(.001,t+.24);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+.26);
  }
  function hat(t,open){
    const len=Math.floor(AC.sampleRate*(open?.14:.045));
    const buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const b=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
    f.type='highpass'; f.frequency.value=7000; g.gain.value=open?.22:.15;
    b.buffer=buf; b.connect(f); f.connect(g); g.connect(bus); b.start(t);
  }
  function bass(t,f0){
    const o=AC.createOscillator(), g=AC.createGain(), fl=AC.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=f0;
    fl.type='lowpass'; fl.frequency.setValueAtTime(900,t); fl.frequency.exponentialRampToValueAtTime(180,t+spb*.9);
    g.gain.setValueAtTime(.30,t); g.gain.exponentialRampToValueAtTime(.001,t+spb*.95);
    o.connect(fl); fl.connect(g); g.connect(bus); o.start(t); o.stop(t+spb);
  }
  function schedule(){
    if(!alive) return;
    while(next < AC.currentTime+.25){
      const s=step%16;
      if(s%4===0) kick(next);
      if(s%2===0) hat(next, s===14);
      if(s%2===0) bass(next, bassLine[(s/2)%8]);
      next += spb/2; step++;
    }
    timer=setTimeout(schedule,60);
  }
  schedule();
  return { stop(){ alive=false; clearTimeout(timer); try{bus.disconnect(); out.disconnect();}catch(e){} } };
}

// ---- analysis + onset-based BPM detection ----
const bassHist = new Array(48).fill(0);
let bhIdx=0, lastOnset=0;
const gaps=[];
function analyse(now){
  analyser.getByteFrequencyData(freqD);
  const n = freqD.length; // 512
  const avg=(a,b)=>{ let s=0; for(let i=a;i<b;i++) s+=freqD[i]; return s/((b-a)*255); };
  const bass=avg(1,6), mid=avg(6,60), treb=avg(60,Math.min(280,n));
  const k = 0.4;
  A.bass += (bass-A.bass)*k; A.mid += (mid-A.mid)*k; A.treb += (treb-A.treb)*k;
  A.energy = A.bass*.5 + A.mid*.35 + A.treb*.15;
  // onsets
  bassHist[bhIdx]=bass; bhIdx=(bhIdx+1)%bassHist.length;
  let mean=0; for(let i=0;i<bassHist.length;i++) mean+=bassHist[i];
  mean/=bassHist.length;
  if(bass > mean*1.30 && bass > .10 && now-lastOnset > 230){
    if(lastOnset){
      const g = now-lastOnset;
      if(g<1500){ gaps.push(g); if(gaps.length>12) gaps.shift(); }
    }
    lastOnset=now;
    if(gaps.length>=6){
      const s=[...gaps].sort((a,b)=>a-b);
      let bpm = 60000/s[Math.floor(s.length/2)];
      while(bpm<70) bpm*=2; while(bpm>180) bpm/=2;
      ST.detBPM = Math.round(bpm);
      if(ST.tempoMode==='auto' && Math.abs(ST.detBPM-ST.bpm)>=2){
        ST.bpm = ST.detBPM;
        // re-anchor phase to this onset so downbeats ride the kick
        ST.nextBeat = now + 60000/ST.bpm;
      }
    }
  }
}

// ============================================================
// BEAT CLOCK — bpm × count, tap tempo, downbeats, phrases
// ============================================================
function reanchor(now){ ST.nextBeat = now + 60000/ST.bpm; }
const taps=[];
function tap(now){
  if(taps.length && now-taps[taps.length-1]>2000) taps.length=0;
  taps.push(now); if(taps.length>7) taps.shift();
  if(taps.length>=3){
    const g=[]; for(let i=1;i<taps.length;i++) g.push(taps[i]-taps[i-1]);
    g.sort((a,b)=>a-b);
    ST.bpm = Math.round(60000/g[Math.floor(g.length/2)]);
    ST.tempoMode='tap'; tempoUI();
  }
  // every tap is treated as a downbeat anchor
  ST.beatIdx = Math.floor((ST.beatIdx+1)/ST.count)*ST.count;
  fireBeat(now, true);
  ST.nextBeat = now + 60000/ST.bpm;
  flashTap();
}
function clockTick(now){
  if(!ST.nextBeat) ST.nextBeat = now + 60000/ST.bpm;
  let guard=0;
  while(now >= ST.nextBeat && guard++<8){
    ST.beatIdx++;
    fireBeat(ST.nextBeat, ST.beatIdx % ST.count === 0);
    ST.nextBeat += 60000/ST.bpm;
  }
  const decay = reduced? .92 : .955;
  ST.beatPulse *= decay; ST.downPulse *= decay;
}
let sweepT = -9999;
function fireBeat(t, down){
  ST.beatPulse = 1;
  dotsUI();
  if(down){
    ST.downPulse = 1;
    spawnRing();
    if(FXLEVEL===2) laserT = performance.now();
    sweepT = performance.now();
    ST.phrase++;
    if(ST.auto && ST.phrase % ST.hold === 0) nextCombo();
    else if(ST.phrase % ST.hold === 0){ L1.tStart = performance.now(); L2.tStart = performance.now()+140; }
  }
}
let comboIdx=-1;
function nextCombo(){
  comboIdx = (comboIdx+1) % COMBOS.length;
  const c = COMBOS[comboIdx];
  ST.scene=c.scene; ST.pal=c.pal; ST.entrance=c.fx; ST.motion=c.mo;
  L1.font=c.f1; L1.style=c.s1; L2.font=c.f2; L2.style=c.s2;
  L1.dirty=L2.dirty=MQ.dirty=true;
  L1.tStart=performance.now(); L2.tStart=performance.now()+140;
  if(FXLEVEL>0) sparkT=performance.now();
  selUI();
}

// ============================================================
// TEXT ENGINE — sprite-cached glyphs (bake once, stamp per frame)
// ============================================================
function mkLine(text, font, style, size){
  return {text, font, style, size, sprites:[], totalW:0, px:0, dirty:true, tStart:performance.now()};
}
const L1 = mkLine('DREAM PALACE', 0, 0, 1);
const L2 = mkLine('CABARET', 12, 2, 1);
const MQ = {text:'FRIDAY NIGHT · DREAM PALACE CABARET · SCOTTSDALE RD', font:3, style:0, size:1,
            sprite:null, dirty:true, x:0};

function fontCSS(fi, px){
  const f=FONTS[fi];
  return (f[3]?'italic ':'') + f[2] + ' ' + px + 'px ' + f[1];
}

// bake a single styled glyph to an offscreen canvas — heavy fx allowed HERE only
function bakeGlyph(ch, fi, px, si, pal){
  const pad = Math.ceil(px*0.55);
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = fontCSS(fi, px);
  const w = Math.ceil(meas.measureText(ch).width);
  const cv = document.createElement('canvas');
  cv.width = w + pad*2; cv.height = Math.ceil(px*1.5) + pad*2;
  const c = cv.getContext('2d');
  const cx = cv.width/2, cy = cv.height/2;
  c.font = fontCSS(fi, px);
  c.textAlign='center'; c.textBaseline='middle';
  const lo=pal[1], mid=pal[2], hi=pal[3];
  const lw = Math.max(2, px*0.045);
  function grad(stops){
    const g=c.createLinearGradient(0,cy-px*0.55,0,cy+px*0.55);
    stops.forEach(s=>g.addColorStop(s[0],s[1]));
    return g;
  }
  function core(fill, strokeCol){
    c.lineJoin='round'; c.lineWidth=lw; c.strokeStyle=strokeCol||'#0A0810';
    c.strokeText(ch,cx,cy);
    c.fillStyle=fill; c.fillText(ch,cx,cy);
  }
  switch(si){
    case 0: // NEON
      c.shadowColor=mid; c.shadowBlur=px*0.32; core(hi); c.shadowBlur=px*0.14; core(hi);
      break;
    case 1: // CHROME
      core(grad([[0,'#FFFFFF'],[0.42,'#C9D2E0'],[0.5,'#4E5766'],[0.58,'#AEB9C9'],[1,'#E8EEF7']]), '#0C0F16');
      break;
    case 2: // ROYAL GOLD
      c.shadowColor='#FFC72E'; c.shadowBlur=px*0.22;
      core(grad([[0,'#FFF6C9'],[0.5,'#F5C542'],[1,'#8A5A08']]), '#241503');
      break;
    case 3: // FIRE
      c.shadowColor='#FF5A00'; c.shadowBlur=px*0.30;
      core(grad([[0,'#FFF0A0'],[0.55,'#FF9A2E'],[1,'#D42605']]), '#2A0500');
      break;
    case 4: // ICE
      c.shadowColor='#57C9FF'; c.shadowBlur=px*0.28;
      core(grad([[0,'#FFFFFF'],[0.55,'#BFEAFF'],[1,'#2E8FD4']]), '#04121F');
      break;
    case 5: // OUTLINE
      c.lineJoin='round';
      c.lineWidth=lw*2.6; c.strokeStyle=hi; c.strokeText(ch,cx,cy);
      c.lineWidth=lw*0.9; c.strokeStyle='#0A0810'; c.strokeText(ch,cx,cy);
      c.fillStyle='rgba(10,8,16,0.45)'; c.fillText(ch,cx,cy);
      break;
    case 6: // SHADOW POP
      c.fillStyle='#0A0810';
      c.fillText(ch, cx+px*0.06, cy+px*0.07);
      core(hi);
      break;
    case 7: // GLITCH — bake base; RGB split happens at stamp time via offsets
      core(hi);
      break;
    case 8: // HOLOGRAM
      c.shadowColor=mid; c.shadowBlur=px*0.20;
      core(grad([[0,'#7DF9FF'],[0.5,hi],[1,'#FF7DEB']]), '#070512');
      c.shadowBlur=0;
      c.globalCompositeOperation='destination-out';
      for(let y=0;y<cv.height;y+=Math.max(3,px*0.075)) c.fillRect(0,y,cv.width,1);
      c.globalCompositeOperation='source-over';
      break;
    case 9:{ // 3D POP
      const steps=Math.max(4,Math.floor(px*0.09));
      for(let i=steps;i>0;i--){
        c.fillStyle = i>steps*0.5 ? '#0A0810' : lo;
        c.fillText(ch, cx+i*0.9, cy+i*0.9);
      }
      core(hi);
      break;
    }
    case 10: // GOLD FOIL
      core(grad([[0,'#FFF6C9'],[0.35,'#F5C542'],[0.5,'#FFFFFF'],[0.65,'#D89B1E'],[1,'#7A4E06']]), '#241503');
      break;
    case 11: // EMBER
      c.shadowColor='#FF3A00'; c.shadowBlur=px*0.26;
      core(grad([[0,'#FF7A2E'],[0.6,'#8C1500'],[1,'#2A0200']]), '#180100');
      break;
    case 12:{ // ELECTRIC SHEEP — fractal fringe: jittered strokes swarm the core
      const seed = ch.charCodeAt(0)*1.7;
      c.lineJoin='round';
      c.lineWidth=Math.max(1, px*0.02);
      for(let k=0;k<10;k++){
        const ang = srnd(seed+k)*Math.PI*2;
        const rad = (0.5+srnd(seed+k+40))*px*0.055;
        c.strokeStyle = k%2 ? mid : hi;
        c.globalAlpha = 0.22;
        c.strokeText(ch, cx+Math.cos(ang)*rad, cy+Math.sin(ang)*rad);
      }
      c.globalAlpha=1;
      c.shadowColor=mid; c.shadowBlur=px*0.34;
      core(hi);
      c.shadowBlur=px*0.12;
      c.lineWidth=Math.max(1, px*0.018); c.strokeStyle='#FFFFFF';
      c.globalAlpha=0.85; c.strokeText(ch,cx,cy); c.globalAlpha=1;
      break;
    }
    case 13:{ // PRISMATIC — full-spectrum sweep with glow
      const g=c.createLinearGradient(cx-px*0.6,cy-px*0.5,cx+px*0.6,cy+px*0.5);
      g.addColorStop(0,'#FF4DD2'); g.addColorStop(0.33,'#4DC3FF');
      g.addColorStop(0.66,'#7DFFB2'); g.addColorStop(1,'#FFD84D');
      c.shadowColor=mid; c.shadowBlur=px*0.24;
      core(g);
      break;
    }
    case 14:{ // VAPORWAVE — pink/cyan horizon split + scanlines
      c.shadowColor='#FF71CE'; c.shadowBlur=px*0.22;
      core(grad([[0,'#FF71CE'],[0.49,'#B967FF'],[0.51,'#01CDFE'],[1,'#05FFA1']]), '#12002E');
      c.shadowBlur=0;
      c.globalCompositeOperation='destination-out';
      for(let y=Math.floor(cv.height*0.5); y<cv.height; y+=Math.max(3,px*0.07))
        c.fillRect(0,y,cv.width,1);
      c.globalCompositeOperation='source-over';
      break;
    }
    case 15:{ // GRAFFITI DRIP — fat white halo, hot fill, paint drips
      const seed = ch.charCodeAt(0)*2.3;
      c.lineJoin='round';
      c.lineWidth=lw*3.2; c.strokeStyle='#FFFFFF'; c.strokeText(ch,cx,cy);
      c.lineWidth=lw*1.1; c.strokeStyle='#0A0810'; c.strokeText(ch,cx,cy);
      c.fillStyle=hi; c.fillText(ch,cx,cy);
      for(let k=0;k<2;k++){
        const dx = cx + (srnd(seed+k)-0.5)*px*0.55;
        const dy = cy + px*0.42;
        const dl = px*(0.18 + srnd(seed+k+9)*0.28);
        const dw = Math.max(2, px*0.06);
        c.fillStyle=hi;
        c.fillRect(dx-dw/2, dy, dw, dl);
        c.beginPath(); c.arc(dx, dy+dl, dw*0.65, 0, Math.PI*2); c.fill();
      }
      break;
    }
    case 16:{ // TOXIC SLIME — acid green ooze + drips
      const seed = ch.charCodeAt(0)*3.1;
      c.shadowColor='#39FF14'; c.shadowBlur=px*0.28;
      core(grad([[0,'#D8FF7A'],[0.55,'#39FF14'],[1,'#0E5C00']]), '#04140A');
      c.shadowBlur=px*0.10;
      for(let k=0;k<2;k++){
        const dx = cx + (srnd(seed+k)-0.5)*px*0.5;
        const dy = cy + px*0.40;
        const dl = px*(0.14 + srnd(seed+k+5)*0.24);
        const dw = Math.max(2, px*0.055);
        c.fillStyle='#39FF14';
        c.fillRect(dx-dw/2, dy, dw, dl);
        c.beginPath(); c.arc(dx, dy+dl, dw*0.7, 0, Math.PI*2); c.fill();
      }
      break;
    }
    case 17:{ // DIAMOND — silver facets + baked sparkle crosses
      const seed = ch.charCodeAt(0)*4.7;
      c.shadowColor='#FFFFFF'; c.shadowBlur=px*0.20;
      core(grad([[0,'#FFFFFF'],[0.35,'#DDE8F5'],[0.5,'#8FA3BD'],[0.65,'#F0F6FF'],[1,'#B8C9DE']]), '#0C1420');
      c.shadowBlur=0;
      c.strokeStyle='#FFFFFF'; c.lineWidth=Math.max(1,px*0.014);
      for(let k=0;k<4;k++){
        const sx = cx + (srnd(seed+k)-0.5)*px*0.7;
        const sy = cy + (srnd(seed+k+11)-0.5)*px*0.8;
        const sl = px*(0.05 + srnd(seed+k+21)*0.05);
        c.globalAlpha = 0.9;
        c.beginPath();
        c.moveTo(sx-sl,sy); c.lineTo(sx+sl,sy);
        c.moveTo(sx,sy-sl); c.lineTo(sx,sy+sl);
        c.stroke();
      }
      c.globalAlpha=1;
      break;
    }
    case 18:{ // BLOOD DRIP — deep crimson + heavy drips
      const seed = ch.charCodeAt(0)*5.3;
      c.shadowColor='#8C0000'; c.shadowBlur=px*0.18;
      core(grad([[0,'#FF3D3D'],[0.5,'#A80000'],[1,'#3D0000']]), '#140000');
      c.shadowBlur=0;
      for(let k=0;k<3;k++){
        const dx = cx + (srnd(seed+k)-0.5)*px*0.6;
        const dy = cy + px*0.38;
        const dl = px*(0.20 + srnd(seed+k+7)*0.34);
        const dw = Math.max(2, px*0.05);
        c.fillStyle='#A80000';
        c.fillRect(dx-dw/2, dy, dw, dl);
        c.beginPath(); c.arc(dx, dy+dl, dw*0.75, 0, Math.PI*2); c.fill();
      }
      break;
    }
    case 19:{ // CIRCUIT — dark board with glowing traces inside the glyph
      const seed = ch.charCodeAt(0)*6.1;
      core(grad([[0,'#12303A'],[1,'#05141A']]), '#020A0D');
      c.globalCompositeOperation='source-atop';
      c.strokeStyle='#28F5D0'; c.lineWidth=Math.max(1,px*0.02);
      c.fillStyle='#28F5D0';
      for(let k=0;k<6;k++){
        let tx = cx + (srnd(seed+k)-0.5)*px*0.7;
        let ty = cy + (srnd(seed+k+13)-0.5)*px*0.8;
        c.beginPath(); c.moveTo(tx,ty);
        for(let s2=0;s2<3;s2++){
          if(srnd(seed+k*7+s2)>0.5) tx += (srnd(seed+k+s2*3)-0.3)*px*0.3;
          else ty += (srnd(seed+k+s2*5)-0.5)*px*0.3;
          c.lineTo(tx,ty);
        }
        c.stroke();
        c.beginPath(); c.arc(tx,ty,Math.max(1.5,px*0.028),0,Math.PI*2); c.fill();
      }
      c.globalCompositeOperation='source-over';
      c.shadowColor='#28F5D0'; c.shadowBlur=px*0.14;
      c.lineWidth=lw*0.8; c.strokeStyle='#28F5D0';
      c.globalAlpha=0.8; c.strokeText(ch,cx,cy); c.globalAlpha=1;
      break;
    }
    case 20:{ // STARDUST — deep space fill with star specks inside
      const seed = ch.charCodeAt(0)*7.9;
      c.shadowColor=mid; c.shadowBlur=px*0.26;
      core(grad([[0,'#2A1A5E'],[0.5,'#10093A'],[1,'#05021A']]), '#020112');
      c.shadowBlur=0;
      c.globalCompositeOperation='source-atop';
      for(let k=0;k<14;k++){
        const sx = cx + (srnd(seed+k)-0.5)*px*0.8;
        const sy = cy + (srnd(seed+k+31)-0.5)*px*0.95;
        const sr = Math.max(0.8, px*(0.008 + srnd(seed+k+61)*0.014));
        c.fillStyle = k%3 ? '#FFFFFF' : hi;
        c.globalAlpha = 0.55 + srnd(seed+k+91)*0.45;
        c.beginPath(); c.arc(sx,sy,sr,0,Math.PI*2); c.fill();
      }
      c.globalAlpha=1;
      c.globalCompositeOperation='source-over';
      c.lineWidth=Math.max(1,px*0.016); c.strokeStyle=hi;
      c.globalAlpha=0.9; c.strokeText(ch,cx,cy); c.globalAlpha=1;
      break;
    }
    case 21:{ // MAGMA — cooled rock with glowing cracks
      const seed = ch.charCodeAt(0)*8.7;
      c.shadowColor='#FF4A00'; c.shadowBlur=px*0.24;
      core(grad([[0,'#3A2A24'],[0.6,'#1C110D'],[1,'#0A0503']]), '#050200');
      c.shadowBlur=0;
      c.globalCompositeOperation='source-atop';
      c.lineWidth=Math.max(1,px*0.022);
      for(let k=0;k<5;k++){
        let tx = cx + (srnd(seed+k)-0.5)*px*0.6;
        let ty = cy - px*0.45;
        const g2=c.createLinearGradient(0,cy-px*0.5,0,cy+px*0.5);
        g2.addColorStop(0,'#FFD84D'); g2.addColorStop(0.6,'#FF6A00'); g2.addColorStop(1,'#7A1500');
        c.strokeStyle=g2;
        c.beginPath(); c.moveTo(tx,ty);
        for(let s2=0;s2<4;s2++){
          tx += (srnd(seed+k*9+s2)-0.5)*px*0.24;
          ty += px*0.24;
          c.lineTo(tx,ty);
        }
        c.stroke();
      }
      c.globalCompositeOperation='source-over';
      break;
    }
  }
  c.shadowBlur=0;
  return {cv, adv: w + px*0.06};
}

function bakeLine(L, basePx){
  const pal = PALETTES[ST.pal];
  const px = Math.round(basePx * L.size);
  L.px = px; L.sprites.length = 0; L.totalW = 0;
  const txt = L.text.toUpperCase();
  for(const ch of txt){
    if(ch===' '){ L.sprites.push(null); L.totalW += px*0.32; continue; }
    const g = bakeGlyph(ch, L.font, Math.round(px*TXSS), L.style, pal);
    g.adv /= TXSS;                       // advance back to CSS units
    g.w = g.cv.width/TXSS; g.h = g.cv.height/TXSS;
    L.sprites.push(g); L.totalW += g.adv;
  }
  L.dirty=false;
}
function bakeMarquee(){
  const pal = PALETTES[ST.pal];
  const px = Math.round(Math.max(22, H*0.042) * MQ.size * TXSS);
  const txt = (MQ.text || ' ').toUpperCase() + '      ';
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = fontCSS(MQ.font, px);
  const w = Math.ceil(meas.measureText(txt).width) + px;
  const cv = document.createElement('canvas');
  cv.width = Math.min(w, 8192); cv.height = Math.ceil(px*1.7);
  const c = cv.getContext('2d');
  c.font = fontCSS(MQ.font, px);
  c.textAlign='left'; c.textBaseline='middle';
  const lw = Math.max(2, px*0.05);
  c.lineJoin='round'; c.lineWidth=lw; c.strokeStyle='#0A0810';
  const g=c.createLinearGradient(0,0,0,cv.height);
  g.addColorStop(0,pal[3]); g.addColorStop(1,pal[2]);
  if(MQ.style===0){ c.shadowColor=pal[2]; c.shadowBlur=px*0.24; }
  c.strokeText(txt, px*0.5, cv.height/2);
  c.fillStyle = MQ.style===1 ? '#EDEDF2' : g;
  c.fillText(txt, px*0.5, cv.height/2);
  c.shadowBlur=0;
  MQ.sprite = cv; MQ.w = cv.width/TXSS; MQ.h = cv.height/TXSS; MQ.dirty=false;
}

// entrance transform for glyph i at time now
function entranceT(L, i, now){
  const e = ST.entrance;
  const stag = e===11 ? 90 : 42, dur = e===11 ? 60 : 460;
  let t = (now - L.tStart - i*stag) / dur;
  t = Math.max(0, Math.min(1, t));
  const back = x => { const s=1.70158; x-=1; return x*x*((s+1)*x+s)+1; };
  const bounce = x => {
    const n=7.5625, d=2.75;
    if(x<1/d) return n*x*x;
    if(x<2/d) return n*(x-=1.5/d)*x+.75;
    if(x<2.5/d) return n*(x-=2.25/d)*x+.9375;
    return n*(x-=2.625/d)*x+.984375;
  };
  const out = {a:1, sx:1, sy:1, dx:0, dy:0, rot:0};
  if(t>=1) return out;
  if(e===0){ const k=back(t); out.sx=out.sy=2.6-(1.6*k); out.a=t; }                    // SLAM
  else if(e===1){ out.dy=(1-t)*(1-t)*L.px*0.9; out.a=t; }                              // SLIDE UP
  else if(e===2){ out.a = t > srnd(i*7.3+L.font) ? 1 : t*0.25; }                       // DISSOLVE
  else if(e===3){ const f=srnd(i*3.1+Math.floor(now/46)); out.a = t*0.4 + (f>0.4?0.6:0); out.dx=(f-0.5)*L.px*0.10*(1-t); } // ELECTRIC
  else if(e===4){ out.a=t*t; out.sx=out.sy=1.15-0.15*t; }                              // GHOST
  else if(e===5){ const k=back(t); out.dx=(i - L.text.length/2)*L.px*0.6*(1-k); out.a=t; } // WARP
  else if(e===6){ // SHATTER — fly in from seeded directions, spinning
    const k=back(t), ang=srnd(i*11.7)*Math.PI*2;
    out.dx=Math.cos(ang)*L.px*2.2*(1-k); out.dy=Math.sin(ang)*L.px*2.2*(1-k);
    out.rot=(srnd(i*5.9)-0.5)*6.0*(1-k); out.a=t;
  }
  else if(e===7){ // SPIN — corkscrew in
    const k=back(t);
    out.rot=(srnd(i*3.3)>0.5?1:-1)*Math.PI*2*(1-k);
    out.sx=out.sy=0.2+0.8*k; out.a=t;
  }
  else if(e===8){ // DROP BOUNCE — fall from above and bounce
    const k=bounce(t);
    out.dy=-(1-k)*L.px*1.6; out.a=Math.min(1,t*3);
  }
  else if(e===9){ // ZOOM PUNCH — blow up past size and snap back
    const k=back(t);
    out.sx=out.sy=0.1+1.28*k-0.38*t; out.a=Math.min(1,t*2.5);
  }
  else if(e===10){ // FLIP UP — hinge up from flat
    out.sy=Math.max(0.02, t*t); out.dy=(1-t)*L.px*0.2; out.a=t;
  }
  else if(e===11){ out.a = t>=1?1:(t>0?1:0); if(t<=0) out.a=0; }                       // TYPEWRITER
  return out;
}
// idle motion for glyph i
function motionT(i, px, now){
  const m = ST.motion, ph = (ST.beatIdx + (1 - Math.min(1,(ST.nextBeat-now)/(60000/ST.bpm))));
  const out = {dx:0, dy:0, rot:0, s:1};
  if(reduced || m===4) return out;
  if(m===0) out.dy = Math.sin(ph*Math.PI + i*0.55) * px*0.05;                 // WAVE
  else if(m===1) out.dy = -Math.abs(Math.sin(ph*Math.PI)) * px*0.07 * ST.beatPulse; // BOUNCE
  else if(m===2) out.rot = Math.sin(ph*Math.PI*0.5 + i*0.4) * 0.05;           // SWAY
  else if(m===3) out.s = 1 + ST.beatPulse*0.075;                              // PULSE
  return out;
}
function drawLine(L, cy, now){
  if(!L.sprites.length && !L.dirty) return;
  const maxW = W*0.92;
  const scale = L.totalW > maxW ? maxW/L.totalW : 1;
  const lineW = L.totalW*scale;
  const x0 = (W - lineW)/2;
  let x = x0;
  const glitchOn = L.style===7;
  const gOff = glitchOn ? (ST.beatPulse*L.px*0.06) : 0;
  for(let i=0;i<L.sprites.length;i++){
    const g = L.sprites[i];
    if(!g){ x += L.px*0.32*scale; continue; }
    const en = entranceT(L, i, now);
    const mo = motionT(i, L.px, now);
    const s = scale * en.sx * mo.s;
    const gx = x + (g.adv*scale)/2 + en.dx + mo.dx;
    const gy = cy + en.dy + mo.dy;
    tctx.save();
    tctx.translate(gx, gy);
    if(mo.rot || en.rot) tctx.rotate(mo.rot + en.rot);
    tctx.scale(s, scale*en.sy*mo.s);
    tctx.globalAlpha = en.a;
    if(glitchOn && gOff>0.5){
      tctx.globalCompositeOperation='lighter';
      tctx.globalAlpha = en.a*0.5;
      tctx.drawImage(g.cv, -g.w/2 - gOff, -g.h/2, g.w, g.h);
      tctx.drawImage(g.cv, -g.w/2 + gOff, -g.h/2, g.w, g.h);
      tctx.globalCompositeOperation='source-over';
      tctx.globalAlpha = en.a;
    }
    tctx.drawImage(g.cv, -g.w/2, -g.h/2, g.w, g.h);
    tctx.restore();
    x += g.adv*scale;
  }
  // ELECTRIC SHEEP live arcs — seeded per beat, so no flicker between frames
  if(L.style===12 && ST.beatPulse>0.25 && lineW>0){
    const pal = PALETTES[ST.pal];
    const hh = L.px*0.75*scale;
    tctx.save();
    tctx.globalCompositeOperation='lighter';
    tctx.lineWidth=Math.max(1.2, L.px*0.014);
    for(let b=0;b<3;b++){
      const seed = ST.beatIdx*13.7 + b*57.3;
      tctx.strokeStyle = b===1 ? '#FFFFFF' : pal[3];
      tctx.globalAlpha = ST.beatPulse*(b===1?0.85:0.55);
      tctx.beginPath();
      let bx = x0 + srnd(seed)*lineW;
      let by = cy - hh;
      tctx.moveTo(bx, by);
      const segs=6;
      for(let sgi=1; sgi<=segs; sgi++){
        bx += (srnd(seed+sgi*3.1)-0.5)*L.px*0.9;
        by = cy - hh + (sgi/segs)*hh*2;
        tctx.lineTo(bx, by);
      }
      tctx.stroke();
    }
    tctx.restore();
  }
  // downbeat shimmer sweep — bright band crossing the line
  const swAge = (now - sweepT)/650;
  if(swAge>=0 && swAge<1 && lineW>0 && !reduced){
    const sx = x0 + swAge*lineW;
    const bw = L.px*1.2;
    const g = tctx.createLinearGradient(sx-bw,0,sx+bw,0);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(0.5,'rgba(255,255,255,'+(0.20*(1-swAge))+')');
    g.addColorStop(1,'rgba(255,255,255,0)');
    tctx.save();
    tctx.globalCompositeOperation='lighter';
    tctx.fillStyle=g;
    tctx.fillRect(sx-bw, cy-L.px*0.8, bw*2, L.px*1.6);
    tctx.restore();
  }
  // STYLE AURAS — stateless seeded particles, zero allocation per frame
  if(FXLEVEL>0 && !reduced && lineW>0) drawAura(L, x0, lineW, cy, now);
}

// aura families: 0 none · 1 rising embers · 2 falling glints · 3 rising bubbles · 4 orbit sparkles
const AURA = {3:1, 11:1, 21:1, 4:2, 17:2, 1:2, 16:3, 20:4, 13:4, 12:4, 8:4};
function drawAura(L, x0, lineW, cy, now){
  const fam = AURA[L.style];
  if(!fam) return;
  const pal = PALETTES[ST.pal];
  const K = FXLEVEL===2 ? 16 : 8;
  const hh = L.px*0.85;
  tctx.save();
  tctx.globalCompositeOperation='lighter';
  for(let k=0;k<K;k++){
    const speed = 0.00022*(0.6+srnd(k+3)*0.9)*(1+A.bass*0.6);
    const ph = (now*speed + srnd(k)) % 1;
    let px2, py, col, r;
    if(fam===1){ // embers rise
      px2 = x0 + srnd(k+9)*lineW + Math.sin(now*0.002+k)*L.px*0.10;
      py = cy + hh*0.6 - ph*hh*2.0;
      col = k%2 ? '#FFB25E' : '#FF5A1F'; r = 3+srnd(k+17)*4;
    } else if(fam===2){ // glints fall
      px2 = x0 + srnd(k+9)*lineW;
      py = cy - hh*0.8 + ph*hh*1.9;
      col = k%3 ? '#FFFFFF' : pal[3]; r = 2+srnd(k+17)*3;
    } else if(fam===3){ // bubbles rise
      px2 = x0 + srnd(k+9)*lineW + Math.sin(now*0.003+k*2)*L.px*0.14;
      py = cy + hh*0.7 - ph*hh*1.8;
      col = '#39FF14'; r = 2+srnd(k+17)*4;
    } else { // orbit sparkles
      const ang = ph*Math.PI*2 + srnd(k)*Math.PI*2;
      px2 = x0 + lineW*0.5 + Math.cos(ang)*(lineW*0.5 + L.px*0.5);
      py = cy + Math.sin(ang)*hh*1.05;
      col = k%2 ? pal[3] : '#FFFFFF'; r = 2+srnd(k+17)*3;
    }
    const fadeA = fam===4 ? 0.5 : Math.sin(ph*Math.PI)*0.7;
    if(fadeA<=0.02) continue;
    const d = glowDot(col, 6);
    const sc = r/6;
    tctx.globalAlpha = fadeA;
    tctx.drawImage(d, px2-d.width*sc/2, py-d.height*sc/2, d.width*sc, d.height*sc);
  }
  tctx.restore();
  tctx.globalAlpha=1;
}
function drawMarquee(now, dt){
  if(!MQ.sprite) return;
  const sp = MQ.sprite;
  const spw = MQ.w || sp.width, sph = MQ.h || sp.height;
  const speed = W * 0.070 * (ST.bpm/96);
  MQ.x -= speed*dt;
  if(MQ.x < -spw) MQ.x += spw;
  const y = H - sph*0.5 - Math.max(10, H*0.012) - 6;
  const pulse = 1 + ST.beatPulse*0.05;
  tctx.save();
  tctx.translate(0, y); tctx.scale(1, pulse); tctx.translate(0, -y);
  let x = MQ.x;
  while(x < W){
    tctx.drawImage(sp, x, y - sph/2, spw, sph);
    x += spw;
  }
  tctx.restore();
}

// ---- downbeat burst rings + cached glow dots (Glyph Bloom) ----
let FXLEVEL = 2; // 0 off · 1 lite · 2 full
const rings=[];
function spawnRing(){ if(rings.length<6) rings.push({r:Math.min(W,H)*0.16, a:0.8}); }
let laserT=-9999, sparkT=-9999;
const dotCache={};
function glowDot(color, r){
  const key=color+'|'+r;
  if(dotCache[key]) return dotCache[key];
  const cv=document.createElement('canvas'); cv.width=cv.height=r*4;
  const c=cv.getContext('2d');
  const g=c.createRadialGradient(r*2,r*2,0,r*2,r*2,r*2);
  g.addColorStop(0,color); g.addColorStop(0.35,color); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(0,0,cv.width,cv.height);
  dotCache[key]=cv; return cv;
}
let latticeRot=0;
function drawGlyphLattice(now){
  const pal = PALETTES[ST.pal];
  const cx=W/2, cy=H/2;
  const R = Math.min(W,H)*0.30*(1 + A.bass*0.45);
  latticeRot += (reduced?0.0006:0.0015) + A.treb*0.005;
  const nodes=[{x:cx,y:cy}];
  for(let ring=1; ring<=2; ring++){
    const rr=R*0.5*ring;
    for(let i=0;i<6;i++){
      const a = latticeRot*(ring===2?-1:1) + i/6*Math.PI*2 + (ring===2?Math.PI/6:0);
      nodes.push({x:cx+Math.cos(a)*rr, y:cy+Math.sin(a)*rr});
    }
  }
  tctx.lineWidth=1;
  tctx.strokeStyle=pal[2];
  tctx.globalAlpha = 0.10 + A.mid*0.40;
  tctx.beginPath();
  for(let i=0;i<nodes.length;i++)
    for(let j=i+1;j<nodes.length;j++){
      tctx.moveTo(nodes[i].x,nodes[i].y); tctx.lineTo(nodes[j].x,nodes[j].y);
    }
  tctx.stroke();
  tctx.globalAlpha=1;
  const dR = Math.max(6, Math.min(W,H)*0.012);
  for(let i=0;i<nodes.length;i++){
    const bin = 3 + i*12;
    const v = freqD ? freqD[Math.min(bin, freqD.length-1)]/255 : 0;
    const col = i===0 ? pal[3] : (i<7 ? pal[2] : pal[3]);
    const d = glowDot(col, dR);
    const sc = 0.5 + v*1.4*(1+A.bass*0.5);
    tctx.globalAlpha = 0.85;
    tctx.drawImage(d, nodes[i].x - d.width*sc/2, nodes[i].y - d.height*sc/2, d.width*sc, d.height*sc);
  }
  tctx.globalAlpha=1;
  tctx.beginPath(); tctx.arc(cx,cy,R,0,Math.PI*2);
  tctx.strokeStyle=pal[3]; tctx.lineWidth=1.5 + A.bass*2.5;
  tctx.globalAlpha=0.3 + A.bass*0.4; tctx.stroke();
  tctx.globalAlpha=1;
}
function drawRings(){
  const pal = PALETTES[ST.pal];
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];
    r.r += (reduced?4:9)*(1+A.bass); r.a*=0.93;
    if(r.a<0.03){ rings.splice(i,1); continue; }
    tctx.beginPath(); tctx.arc(W/2,H/2,r.r,0,Math.PI*2);
    tctx.strokeStyle=pal[3]; tctx.lineWidth=2;
    tctx.globalAlpha=r.a; tctx.stroke();
  }
  tctx.globalAlpha=1;
}
// ---- LASER SWEEP: two beams fan out from the bottom corners on the downbeat ----
function drawLasers(now){
  const age = (now - laserT)/750;
  if(age<0 || age>=1) return;
  const pal = PALETTES[ST.pal];
  const fade = 1-age;
  tctx.save();
  tctx.globalCompositeOperation='lighter';
  tctx.lineWidth=Math.max(2, H*0.004);
  for(let b=0;b<2;b++){
    const ox = b===0 ? 0 : W;
    const dir = b===0 ? 1 : -1;
    const ang = (-Math.PI/2) + dir*(0.15 + age*1.1);
    const ex = ox + Math.cos(ang)*H*1.6*dir*-1;
    const ey = H + Math.sin(ang)*H*1.6;
    const g = tctx.createLinearGradient(ox,H,ex,ey);
    g.addColorStop(0,pal[3]); g.addColorStop(1,'rgba(0,0,0,0)');
    tctx.strokeStyle=g;
    tctx.globalAlpha=fade*0.6;
    tctx.beginPath(); tctx.moveTo(ox,H); tctx.lineTo(ex,ey); tctx.stroke();
    const d = glowDot(pal[3], 10);
    tctx.globalAlpha=fade*0.8;
    tctx.drawImage(d, ox-d.width/2, H-d.height/2);
  }
  tctx.restore();
  tctx.globalAlpha=1;
}
// ---- SPARK SHOWER: seeded burst raining from top on every look change ----
function drawSparks(now){
  const age = (now - sparkT)/1300;
  if(age<0 || age>=1) return;
  const pal = PALETTES[ST.pal];
  const K = FXLEVEL===2 ? 42 : 20;
  tctx.save();
  tctx.globalCompositeOperation='lighter';
  for(let k=0;k<K;k++){
    const sd = srnd(k*1.31 + comboIdx*77.7);
    const vx = (srnd(k+40)-0.5)*W*0.6;
    const x = W/2 + vx*age;
    const y = H*0.06 + srnd(k+80)*H*0.12 + age*age*H*0.95;
    if(y>H) continue;
    const fade = (1-age)*(0.5+srnd(k+120)*0.5);
    const col = k%3===0 ? '#FFFFFF' : (k%3===1 ? pal[3] : pal[2]);
    const d = glowDot(col, 6);
    const sc = (2+sd*3)/6;
    tctx.globalAlpha=fade;
    tctx.drawImage(d, x-d.width*sc/2, y-d.height*sc/2, d.width*sc, d.height*sc);
  }
  tctx.restore();
  tctx.globalAlpha=1;
}
// ---- CORNER PADS: soft glow pulsing in the corners with the beat ----
function drawPads(){
  const pal = PALETTES[ST.pal];
  const d = glowDot(pal[2], 14);
  const R = Math.min(W,H)*0.42*(0.8 + ST.beatPulse*0.35);
  tctx.save();
  tctx.globalCompositeOperation='lighter';
  tctx.globalAlpha = 0.10 + ST.downPulse*0.14;
  const pts=[[0,0],[W,0],[0,H],[W,H]];
  for(const [px2,py] of pts) tctx.drawImage(d, px2-R, py-R, R*2, R*2);
  tctx.restore();
  tctx.globalAlpha=1;
}
// ---- frequency strip along the bottom edge ----
function drawStrip(){
  if(!freqD) return;
  const pal = PALETTES[ST.pal];
  const N=64, bw=W/N;
  tctx.globalAlpha=0.8;
  for(let i=0;i<N;i++){
    const bin = Math.floor(Math.pow(i/N,1.6)*300)+2;
    const v = freqD[Math.min(bin,freqD.length-1)]/255;
    const h = 2 + v*Math.max(14, H*0.03);
    tctx.fillStyle = i%2? pal[2] : pal[3];
    tctx.fillRect(i*bw+1, H-h, bw-2, h);
  }
  tctx.globalAlpha=1;
}

// ============================================================
// UI
// ============================================================
const deck=$('deck'), gate=$('gate'), bpmBig=$('bpmBig'), dotsEl=$('dots');
const hudBpm=$('hudBpm'), hb1=$('hb1'), hb2=$('hb2'), hb3=$('hb3'), hudResEl=$('hudRes');
const toastEl=$('toast');
let toastT=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1600);
}
function fill(sel, arr, fmt){
  sel.innerHTML='';
  arr.forEach((v,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent = fmt? fmt(v):v;
    sel.appendChild(o);
  });
}
fill($('sceneSel'), SCENES);
fill($('palSel'), PALETTES, p=>p[0]);
fill($('fxSel'), ENTRANCES);
fill($('moSel'), MOTIONS);
['f1Sel','f2Sel','mqFontSel'].forEach(id=>fill($(id), FONTS, f=>f[0]));
['s1Sel','s2Sel'].forEach(id=>fill($(id), STYLES));
fill($('mqStyleSel'), ['NEON','CLEAN']);
fill($('qSel'), QUALITY, q=>q.name);

function setQuality(i){
  QI = Math.max(0, Math.min(QUALITY.length-1, i));
  adaptK = 1.0;
  $('qSel').value = QI;
  resize();
  toast('RENDER · ' + QUALITY[QI].name);
}
$('qSel').addEventListener('change', e=>setQuality(+e.target.value));

function dotsUI(){
  const kids=dotsEl.children;
  for(let i=0;i<kids.length;i++)
    kids[i].className = 'dot' + (i===((ST.beatIdx%ST.count)+ST.count)%ST.count ? (i===0?' on down':' on') : '');
}
function buildDots(){
  dotsEl.innerHTML='';
  for(let i=0;i<ST.count;i++){ const d=document.createElement('span'); d.className='dot'; dotsEl.appendChild(d); }
}
function selUI(){
  $('sceneSel').value=ST.scene; $('palSel').value=ST.pal;
  $('fxSel').value=ST.entrance; $('moSel').value=ST.motion;
  $('f1Sel').value=L1.font; $('s1Sel').value=L1.style;
  $('f2Sel').value=L2.font; $('s2Sel').value=L2.style;
  $('autoBtn').classList.toggle('on', ST.auto);
}
function tempoUI(){
  $('tmAuto').classList.toggle('on', ST.tempoMode==='auto');
  $('tmTap').classList.toggle('on', ST.tempoMode==='tap');
}
function srcUI(){
  $('micBtn').classList.toggle('on', ST.source==='mic');
  $('demoBtn').classList.toggle('on', ST.source==='demo');
}
function flashTap(){ const b=$('tapBtn'); b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),120); }

function manualTouch(){
  if(ST.auto){ ST.auto=false; $('autoBtn').classList.remove('on'); toast('MANUAL CONTROL'); }
}

$('sceneSel').addEventListener('change', e=>{ manualTouch(); ST.scene=+e.target.value; });
$('palSel').addEventListener('change', e=>{ manualTouch(); ST.pal=+e.target.value; L1.dirty=L2.dirty=MQ.dirty=true; });
$('fxSel').addEventListener('change', e=>{ manualTouch(); ST.entrance=+e.target.value; L1.tStart=performance.now(); L2.tStart=performance.now()+140; });
$('moSel').addEventListener('change', e=>{ manualTouch(); ST.motion=+e.target.value; });

function lineWire(L, txtId, fontId, styleId, minusId, plusId, useDNA){
  $(txtId).addEventListener('input', e=>{ L.text=e.target.value; L.dirty=true; L.tStart=performance.now(); });
  $(fontId).addEventListener('change', e=>{
    manualTouch(); L.font=+e.target.value; L.dirty=true; L.tStart=performance.now();
    if(useDNA){
      const dna = DNA[FONTS[L.font][0]];
      if(dna){ L.style=dna[0]; ST.motion=dna[1]; $(styleId).value=L.style; $('moSel').value=ST.motion; }
    }
  });
  $(styleId).addEventListener('change', e=>{ manualTouch(); L.style=+e.target.value; L.dirty=true; L.tStart=performance.now(); });
  $(minusId).addEventListener('click', ()=>{ L.size=Math.max(0.5, +(L.size-0.1).toFixed(2)); L.dirty=true; });
  $(plusId).addEventListener('click', ()=>{ L.size=Math.min(2.0, +(L.size+0.1).toFixed(2)); L.dirty=true; });
}
lineWire(L1,'l1Txt','f1Sel','s1Sel','l1Minus','l1Plus',true);
lineWire(L2,'l2Txt','f2Sel','s2Sel','l2Minus','l2Plus',false);
$('mqTxt').addEventListener('input', e=>{ MQ.text=e.target.value; MQ.dirty=true; });
$('mqFontSel').addEventListener('change', e=>{ MQ.font=+e.target.value; MQ.dirty=true; });
$('mqStyleSel').addEventListener('change', e=>{ MQ.style=+e.target.value; MQ.dirty=true; });
$('mqMinus').addEventListener('click', ()=>{ MQ.size=Math.max(0.5,+(MQ.size-0.1).toFixed(2)); MQ.dirty=true; });
$('mqPlus').addEventListener('click', ()=>{ MQ.size=Math.min(2.0,+(MQ.size+0.1).toFixed(2)); MQ.dirty=true; });

$('autoBtn').addEventListener('click', ()=>{
  ST.auto=!ST.auto;
  $('autoBtn').classList.toggle('on', ST.auto);
  toast(ST.auto?'AUTO SHOW':'MANUAL CONTROL');
  if(ST.auto) nextCombo();
});
$('tapBtn').addEventListener('click', ()=>tap(performance.now()));
$('countSel').addEventListener('change', e=>{ ST.count=+e.target.value; buildDots(); });
$('holdSel').addEventListener('change', e=>{ ST.hold=+e.target.value; toast('HOLD · '+ST.hold+' BARS'); });
$('fxLvlSel').addEventListener('change', e=>{ FXLEVEL=+e.target.value; toast(['FX OFF','FX LITE','FX FULL'][FXLEVEL]); });
$('tmAuto').addEventListener('click', ()=>{ ST.tempoMode='auto'; tempoUI(); toast('BPM: AUTO DETECT'); });
$('tmTap').addEventListener('click', ()=>{ ST.tempoMode='tap'; tempoUI(); toast('BPM: TAP LOCKED'); });
$('micBtn').addEventListener('click', startMic);
$('demoBtn').addEventListener('click', startDemo);

function goFS(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}
$('fsCorner').addEventListener('click', goFS);
$('pinCorner').addEventListener('click', ()=>{
  ST.pinned=!ST.pinned;
  $('pinCorner').classList.toggle('on', ST.pinned);
  bumpUI();
});

// gate
$('gateMic').addEventListener('click', async ()=>{ if(await startMic()) hideGate(); });
$('gateDemo').addEventListener('click', ()=>{ startDemo(); hideGate(); });
function hideGate(){ gate.classList.add('off'); bumpUI(); reanchor(performance.now()); }

// auto-hide deck
let uiT=null;
function bumpUI(){
  wrap.classList.add('ui');
  clearTimeout(uiT);
  if(!ST.pinned && ST.running)
    uiT=setTimeout(()=>{
      if(document.activeElement && document.activeElement.tagName==='INPUT') { bumpUI(); return; }
      wrap.classList.remove('ui');
    }, 4200);
}
['pointermove','pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev, bumpUI, {passive:true}));

// keyboard
window.addEventListener('keydown', e=>{
  const typing = e.target.tagName==='INPUT' || e.target.tagName==='SELECT';
  if(e.code==='Space' && !typing){ e.preventDefault(); tap(performance.now()); return; }
  if(typing) return;
  const k=e.key.toLowerCase();
  if(k==='f') goFS();
  else if(k==='a') $('autoBtn').click();
  else if(k==='m') startMic();
  else if(k==='d') startDemo();
  else if(k==='p') $('pinCorner').click();
  else if(k==='q') setQuality((QI+1) % QUALITY.length);
  else if(k==='['){ manualTouch(); ST.pal=(ST.pal+PALETTES.length-1)%PALETTES.length; L1.dirty=L2.dirty=MQ.dirty=true; selUI(); }
  else if(k===']'){ manualTouch(); ST.pal=(ST.pal+1)%PALETTES.length; L1.dirty=L2.dirty=MQ.dirty=true; selUI(); }
  else{
    const n=parseInt(e.key);
    if(n>=1 && n<=9){ manualTouch(); ST.scene=n-1; selUI(); }
  }
});

// ============================================================
// MAIN LOOP
// ============================================================
let lastT=performance.now(), resT=0;
function frame(nowMs){
  requestAnimationFrame(frame);
  const now=nowMs, dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  govern(dt*1000);
  if(ST.running && analyser) analyse(now);
  else { A.bass*=.96; A.mid*=.96; A.treb*=.96; A.energy*=.96; }
  if(ST.running) clockTick(now);

  glDraw(now/1000);

  tctx.clearRect(0,0,W,H);
  if(FXLEVEL>0) drawPads();
  if(ST.scene===GLYPH_SCENE) drawGlyphLattice(now);
  drawRings();
  if(FXLEVEL===2){ drawLasers(now); }
  if(FXLEVEL>0){ drawSparks(now); }

  const base1 = Math.min(W*0.115, H*0.20);
  const base2 = Math.min(W*0.070, H*0.12);
  if(L1.dirty) bakeLine(L1, base1);
  if(L2.dirty) bakeLine(L2, base2);
  if(MQ.dirty) bakeMarquee();
  drawLine(L1, H*0.40, now);
  drawLine(L2, H*0.575, now);
  drawMarquee(now, dt);
  drawStrip();

  // HUD + deck readouts (cheap DOM writes throttled)
  if((now|0) % 4 === 0){
    bpmBig.textContent = ST.bpm;
    hudBpm.textContent = ST.bpm + (ST.tempoMode==='auto' ? '·A' : '·T');
    hb1.style.width=(A.bass*100)+'%';
    hb2.style.width=(A.mid*100)+'%';
    hb3.style.width=(A.treb*100)+'%';
  }
  if(now - resT > 600){
    resT = now;
    hudResEl.textContent = RS.cw + '×' + RS.ch + ' · ' + Math.round(fbW/RS.cw*100) + '% · '
                         + (HDR ? 'HDR' : 'SDR') + ' · ' + Math.round(PERF.fps) + 'FPS';
  }
}

// ---------- NUPS DJ APP BRIDGE ----------
let hostTrackKey = '';
let hostTransitioning = false;
const cleanHostText = (value, fallback, maxLength) => {
  const cleaned = String(value ?? '').replace(/\s+/g, ' ').trim();
  return (cleaned || fallback).slice(0, maxLength);
};
const syncHostInput = (id, value) => {
  const input = $(id);
  if (input && input.value !== value) input.value = value;
};

window.addEventListener('message', (event) => {
  if (event.source !== window.parent || event.origin !== window.location.origin) return;
  const data = event.data;
  if (!data || data.type !== 'NUPS_FABLE_STATE') return;

  const title = cleanHostText(data.title, 'N.U.P.S.', 72);
  const artist = cleanHostText(data.artist, 'AUTONOMOUS DJ', 72);
  const deck = data.activeDeck === 'B' ? 'DECK B' : 'DECK A';
  const marquee = cleanHostText(
    data.marquee,
    'NOW PLAYING · ' + title + ' · ' + artist + ' · ' + deck,
    180
  );

  const trackKey = title + '\u0000' + artist;
  if (trackKey !== hostTrackKey) {
    hostTrackKey = trackKey;
    L1.text = title;
    L2.text = artist;
    MQ.text = marquee;
    L1.dirty = L2.dirty = MQ.dirty = true;
    L1.tStart = performance.now();
    L2.tStart = performance.now() + 140;
    syncHostInput('l1Txt', title);
    syncHostInput('l2Txt', artist);
    syncHostInput('mqTxt', marquee);
    if (ST.auto && title !== 'N.U.P.S.') nextCombo();
  } else if (MQ.text !== marquee) {
    MQ.text = marquee;
    MQ.dirty = true;
    syncHostInput('mqTxt', marquee);
  }

  const bpm = Number(data.bpm);
  if (Number.isFinite(bpm) && bpm >= 50 && bpm <= 220 && Math.abs(ST.bpm - bpm) >= 0.5) {
    ST.bpm = Math.round(bpm);
    ST.detBPM = ST.bpm;
    ST.tempoMode = 'tap';
    reanchor(performance.now());
    tempoUI();
  }

  if (data.transitioning && !hostTransitioning) {
    ST.downPulse = 1;
    ST.beatPulse = 1;
    if (ST.auto) nextCombo();
  }
  hostTransitioning = Boolean(data.transitioning);
});

// ---------- BOOT ----------
resize();
try{ glInit(); }catch(err){
  console.error(err);
  toast('GPU INIT FAILED — CHECK WEBGL2');
}
buildDots(); selUI(); tempoUI();
$('qSel').value = QI;
$('l1Txt').value=L1.text; $('l2Txt').value=L2.text; $('mqTxt').value=MQ.text;
if(document.fonts && document.fonts.ready)
  document.fonts.ready.then(()=>{ L1.dirty=L2.dirty=MQ.dirty=true; });
requestAnimationFrame(frame);
bumpUI();
if (window.parent !== window) {
  window.parent.postMessage({type:'NUPS_FABLE_READY'}, window.location.origin);
}

})();

</script>
