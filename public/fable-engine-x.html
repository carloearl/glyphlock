<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dream Palace Fable Engine X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Anton&family=Archivo+Black&family=Audiowide&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Bungee&family=Bungee+Shade&family=Chango&family=Cinzel:wght@900&family=Creepster&family=Exo+2:ital,wght@1,900&family=Faster+One&family=Fjalla+One&family=Lobster&family=Luckiest+Guy&family=Metal+Mania&family=Michroma&family=Monoton&family=Nosifer&family=Orbitron:wght@900&family=Oswald:wght@500;700&family=Pacifico&family=Passion+One:wght@900&family=Permanent+Marker&family=Pirata+One&family=Playfair+Display:ital,wght@1,900&family=Press+Start+2P&family=Righteous&family=Rubik+Mono+One&family=Russo+One&family=Rye&family=Shrikhand&family=Staatliches&family=Teko:wght@700&family=Titan+One&family=Ultra&family=Wallpoet&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07050D; --panel:rgba(12,9,20,.86); --line:rgba(157,107,255,.20);
  --text:#EDE9F7; --muted:#75699A; --gold:#FFC72E; --ame:#9D6BFF; --rose:#FF4D8D;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Oswald',sans-serif;color:var(--text);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,select,input{font-family:inherit}
button{cursor:pointer;background:none;border:none;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

#wrap{position:fixed;inset:0}
#gl,#tx{position:absolute;inset:0;width:100%;height:100%}
#tx{pointer-events:none}

/* ---------- HUD (always on, subtle) ---------- */
#hud{
  position:absolute;top:14px;left:16px;z-index:14;pointer-events:none;
  font-family:'Oswald',sans-serif;opacity:.6;transition:opacity .3s;
}
#wrap.ui #hud{opacity:.95}
#hud .brand{font-weight:700;font-size:13px;letter-spacing:.32em;color:var(--text)}
#hud .brand b{color:var(--gold);font-weight:700}
#hud .sub{font-size:8.5px;letter-spacing:.3em;color:#8E82B0;margin-top:2px}
#hud .live{display:flex;align-items:center;gap:8px;margin-top:8px}
#hud .res{font-size:8px;letter-spacing:.24em;color:#6B6091;margin-top:6px;font-weight:500}
#hud .live .bpm{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.06em;min-width:44px}
#hud .hband{width:30px;height:3px;background:rgba(255,255,255,.10);border-radius:2px;overflow:hidden}
#hud .hband i{display:block;height:100%;width:0}
#hb1{background:var(--gold)} #hb2{background:var(--ame)} #hb3{background:var(--rose)}

/* ---------- corner buttons (always visible) ---------- */
.corner{
  position:absolute;right:14px;z-index:22;width:44px;height:44px;border-radius:12px;
  background:rgba(12,9,20,.6);border:1px solid var(--line);color:#B7ACD6;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);
  transition:color .2s,border-color .2s,background .2s;
}
.corner:hover{color:var(--text)}
.corner.on{color:var(--gold);border-color:rgba(255,199,46,.5)}
#fsCorner{top:14px}
#pinCorner{top:66px}
.corner svg{width:19px;height:19px}

/* ---------- toast ---------- */
#toast{
  position:absolute;top:20px;left:50%;transform:translateX(-50%) translateY(-6px);
  background:var(--panel);border:1px solid var(--line);color:var(--text);z-index:30;
  padding:8px 18px;border-radius:8px;font-size:12px;letter-spacing:.18em;font-weight:500;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  backdrop-filter:blur(12px);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- gate ---------- */
#gate{
  position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%, #14092B 0%, #07050D 70%);
  transition:opacity .6s;
}
#gate.off{opacity:0;pointer-events:none}
.gateCard{text-align:center;padding:0 24px}
.gateCard h1{
  font-family:'Cinzel',serif;font-weight:900;font-size:clamp(30px,6vw,54px);
  letter-spacing:.14em;color:var(--text);
}
.gateCard h1 b{color:var(--gold);font-weight:900}
.gateCard p{
  font-size:12px;letter-spacing:.34em;color:#8E82B0;margin:12px 0 34px;font-weight:500;
}
.gateBtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.gbtn{
  font-size:13px;font-weight:700;letter-spacing:.22em;padding:15px 30px;border-radius:100px;
  transition:transform .15s,box-shadow .2s;
}
.gbtn:active{transform:scale(.96)}
.gbtn.gold{background:var(--gold);color:#1A1206;box-shadow:0 8px 34px rgba(255,199,46,.35)}
.gbtn.ghost{border:1px solid var(--line);color:var(--text);background:rgba(157,107,255,.07)}

/* ---------- deck ---------- */
#deck{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(16px);
  width:min(1180px, calc(100vw - 20px));z-index:20;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:10px 14px;opacity:0;pointer-events:none;
  transition:opacity .35s,transform .35s;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
#wrap.ui #deck{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row + .row{margin-top:8px;padding-top:8px;border-top:1px solid rgba(157,107,255,.10)}

.lbl{font-size:9px;letter-spacing:.22em;color:#8E82B0;font-weight:700;flex:none}

select{
  background:#171028;border:1px solid var(--line);color:var(--text);
  font-size:11px;font-weight:500;letter-spacing:.06em;
  padding:8px 8px;border-radius:8px;max-width:140px;
}
input[type=text]{
  background:#171028;border:1px solid var(--line);color:var(--text);
  font-size:12px;font-weight:500;letter-spacing:.06em;
  padding:8px 10px;border-radius:8px;width:170px;
  -webkit-user-select:text;user-select:text;
}
input[type=text]::placeholder{color:#5C527A}
.btn{
  font-size:11px;font-weight:700;letter-spacing:.14em;color:#B7ACD6;
  border:1px solid var(--line);border-radius:8px;padding:8px 13px;
  transition:color .15s,border-color .15s,background .15s;
}
.btn:hover{color:var(--text)}
.btn.on{color:var(--gold);border-color:rgba(255,199,46,.55);background:rgba(255,199,46,.08)}
.step{
  width:32px;height:32px;border:1px solid var(--line);border-radius:8px;color:#B7ACD6;
  font-size:15px;font-weight:700;line-height:1;flex:none;
}
.step:hover{color:var(--text)}

/* tempo cluster */
#bpmBig{
  font-size:24px;font-weight:700;color:var(--gold);letter-spacing:.04em;
  min-width:52px;text-align:center;flex:none;
}
#dots{display:flex;gap:5px;flex:none;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.14);transition:transform .1s,background .1s}
.dot.on{background:var(--ame);transform:scale(1.35)}
.dot.on.down{background:var(--gold);transform:scale(1.6)}
#tapBtn{
  background:var(--gold);color:#1A1206;font-weight:700;font-size:12px;letter-spacing:.2em;
  padding:10px 20px;border-radius:100px;flex:none;transition:transform .1s,box-shadow .12s;
  box-shadow:0 4px 18px rgba(255,199,46,.28);
}
#tapBtn.hit{transform:scale(.92)}
.pair{display:flex;gap:0;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pair button{font-size:10px;font-weight:700;letter-spacing:.12em;padding:8px 11px;color:#8E82B0}
.pair button.on{background:rgba(157,107,255,.22);color:var(--text)}
.grow{flex:1}
.grp{display:flex;align-items:center;gap:6px;flex:none}

@media (max-width:900px){
  input[type=text]{width:120px}
  select{max-width:104px}
  #hud .sub{display:none}
}
@media (prefers-reduced-motion:reduce){
  #deck,#toast,.dot{transition:none}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="tx"></canvas>

  <div id="hud">
    <div class="brand">DREAM <b>PALACE</b></div>
    <div class="sub">FABLE ENGINE X · GLYPHLOCK</div>
    <div class="live">
      <span class="bpm" id="hudBpm">96</span>
      <span class="hband"><i id="hb1"></i></span>
      <span class="hband"><i id="hb2"></i></span>
      <span class="hband"><i id="hb3"></i></span>
    </div>
    <div class="res" id="hudRes">—</div>
  </div>

  <button id="fsCorner" class="corner" title="Fullscreen (F)" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="pinCorner" class="corner" title="Pin menu (P)" aria-label="Pin menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M8 3h8l-1 7 3 3H6l3-3z"/></svg>
  </button>

  <div id="toast"></div>

  <div id="gate">
    <div class="gateCard">
      <h1>DREAM <b>PALACE</b></h1>
      <p>FABLE ENGINE X · CABARET VISUALS</p>
      <div class="gateBtns">
        <button class="gbtn gold" id="gateMic">GO LIVE · ROOM MIC</button>
        <button class="gbtn ghost" id="gateDemo">DEMO BEAT</button>
      </div>
    </div>
  </div>

  <div id="deck">
    <div class="row">
      <span id="bpmBig">96</span>
      <span id="dots"></span>
      <button id="tapBtn">TAP</button>
      <div class="grp">
        <span class="lbl">COUNT</span>
        <select id="countSel">
          <option value="3">3</option><option value="4" selected>4</option>
          <option value="5">5</option><option value="6">6</option><option value="8">8</option>
        </select>
      </div>
      <div class="grp">
        <span class="lbl">HOLD</span>
        <select id="holdSel" title="Bars each auto-show look holds">
          <option value="4">4 BARS</option><option value="8" selected>8 BARS</option>
          <option value="16">16 BARS</option><option value="32">32 BARS</option>
        </select>
      </div>
      <div class="pair" role="group" aria-label="Tempo source">
        <button id="tmAuto" class="on">AUTO BPM</button><button id="tmTap">TAP LOCK</button>
      </div>
      <span class="grow"></span>
      <div class="grp"><span class="lbl">SCENE</span><select id="sceneSel"></select></div>
      <div class="grp"><span class="lbl">COLOR</span><select id="palSel"></select></div>
      <button id="autoBtn" class="btn on" title="Auto show (A)">AUTO SHOW</button>
      <button id="micBtn" class="btn" title="Room mic (M)">MIC</button>
      <button id="demoBtn" class="btn" title="Demo beat (D)">DEMO</button>
    </div>
    <div class="row">
      <span class="lbl">LINE 1</span>
      <input type="text" id="l1Txt" maxlength="24" placeholder="Line 1">
      <select id="f1Sel" title="Line 1 font"></select>
      <select id="s1Sel" title="Line 1 style"></select>
      <button class="step" id="l1Minus" aria-label="Line 1 smaller">−</button>
      <button class="step" id="l1Plus" aria-label="Line 1 bigger">+</button>
      <span class="grow"></span>
      <span class="lbl">LINE 2</span>
      <input type="text" id="l2Txt" maxlength="28" placeholder="Line 2">
      <select id="f2Sel" title="Line 2 font"></select>
      <select id="s2Sel" title="Line 2 style"></select>
      <button class="step" id="l2Minus" aria-label="Line 2 smaller">−</button>
      <button class="step" id="l2Plus" aria-label="Line 2 bigger">+</button>
    </div>
    <div class="row">
      <span class="lbl">MARQUEE</span>
      <input type="text" id="mqTxt" maxlength="80" placeholder="Scrolling marquee" style="width:280px">
      <select id="mqFontSel" title="Marquee font"></select>
      <select id="mqStyleSel" title="Marquee style"></select>
      <button class="step" id="mqMinus" aria-label="Marquee smaller">−</button>
      <button class="step" id="mqPlus" aria-label="Marquee bigger">+</button>
      <span class="grow"></span>
      <div class="grp"><span class="lbl">ENTRANCE</span><select id="fxSel"></select></div>
      <div class="grp"><span class="lbl">MOTION</span><select id="moSel"></select></div>
      <div class="grp"><span class="lbl">RENDER</span>
        <select id="qSel" title="Render quality (Q)"></select>
      </div>
      <div class="grp"><span class="lbl">FX</span>
        <select id="fxLvlSel">
          <option value="0">OFF</option><option value="1">LITE</option><option value="2" selected>FULL</option>
        </select>
      </div>
    </div>
  </div>
</div>
<script>
// ============ DREAM PALACE FABLE ENGINE X — SHADERS ============
const VERT = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

// Scene pass: draws the GPU scene and folds in the previous frame for trails
const SCENE_FRAG = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform float uBass, uMid, uTreb, uEnergy, uBeat, uDown;
uniform int uScene;
uniform vec3 uColA, uColB, uColC;
uniform sampler2D uPrev;
uniform float uTrail;
uniform float uQual;   // 0 lite · 1 sharp · 2 ultra
uniform float uHdr;    // headroom ceiling (1.6 LDR · 14.0 HDR)
in vec2 vUv; out vec4 fragColor;

mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
mat3 rotX(float a){ float c=cos(a),s=sin(a); return mat3(1.0,0.0,0.0, 0.0,c,-s, 0.0,s,c); }
mat3 rotY(float a){ float c=cos(a),s=sin(a); return mat3(c,0.0,-s, 0.0,1.0,0.0, s,0.0,c); }

// --- low-bias hashes: no visible lattice artifacts at 4K ---
float hash(vec2 p){
  vec3 q = fract(vec3(p.xyx)*0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
vec2 hash22(vec2 p){
  vec3 q = fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
  q += dot(q, q.yzx + 33.33);
  return fract((q.xx + q.yz) * q.zy);
}
float hash3(vec3 p){
  p = fract(p*0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
// --- gradient (Perlin) noise: smooth, isotropic, no blocky value-noise grid ---
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);
  vec2 g00=hash22(i)*2.0-1.0,                g10=hash22(i+vec2(1.0,0.0))*2.0-1.0;
  vec2 g01=hash22(i+vec2(0.0,1.0))*2.0-1.0,  g11=hash22(i+vec2(1.0,1.0))*2.0-1.0;
  float a=dot(g00,f),               b=dot(g10,f-vec2(1.0,0.0));
  float c=dot(g01,f-vec2(0.0,1.0)), d=dot(g11,f-vec2(1.0,1.0));
  return clamp(0.5 + 0.74*mix(mix(a,b,u.x), mix(c,d,u.x), u.y), 0.0, 1.0);
}
float fbm(vec2 p){
  float v=0.0, a=0.5;
  mat2 m = mat2(0.80,0.60,-0.60,0.80);   // rotate each octave: kills axis streaking
  int oct = uQual>1.5 ? 7 : (uQual>0.5 ? 5 : 4);
  for(int i=0;i<7;i++){
    if(i>=oct) break;
    v += a*noise(p); p = m*p*2.03 + 17.13; a *= 0.5;
  }
  return v;
}

// --- geometry primitives ---
float sdSeg(vec2 p, vec2 a, vec2 b){
  vec2 pa=p-a, ba=b-a;
  float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.0,1.0);
  return length(pa-ba*h);
}
float sdBox3(vec3 p, vec3 b){
  vec3 q=abs(p)-b;
  return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0);
}
float sdTetra(vec3 p, float r){
  return (max(abs(p.x+p.y)-p.z, abs(p.x-p.y)+p.z) - r) * 0.57735027;
}
float noise3(vec3 p){
  vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float n000=hash3(i), n100=hash3(i+vec3(1.,0.,0.));
  float n010=hash3(i+vec3(0.,1.,0.)), n110=hash3(i+vec3(1.,1.,0.));
  float n001=hash3(i+vec3(0.,0.,1.)), n101=hash3(i+vec3(1.,0.,1.));
  float n011=hash3(i+vec3(0.,1.,1.)), n111=hash3(i+vec3(1.,1.,1.));
  return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),
             mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y), f.z);
}
float fbm3(vec3 p){
  float v=0.0, a=0.5;
  int oct = uQual>1.5 ? 5 : (uQual>0.5 ? 4 : 3);
  for(int i=0;i<5;i++){ if(i>=oct) break; v+=a*noise3(p); p=p*2.1+11.3; a*=0.5; }
  return v;
}
vec3 grade(float t){
  t = clamp(t,0.0,1.0);
  return t<0.5 ? mix(uColA,uColB,t*2.0) : mix(uColB,uColC,t*2.0-1.0);
}

// 0 — ELECTRIC SHEEP: iterated fractal-glass fold — living filament sheets
vec3 scElectricSheep(vec2 uv){
  vec2 p = (uv-0.5)*vec2(uRes.x/uRes.y,1.0)*2.0;
  p *= rot(uTime*0.04);
  float acc = 0.0, glow = 1e9;
  float k = 0.85 + 0.10*sin(uTime*0.11) + uBass*0.10;
  for(int i=0;i<5;i++){
    p = abs(p)/dot(p,p) - k;
    p *= rot(0.35 + uTime*0.015 + uMid*0.2);
    float l = length(p);
    acc += exp(-l*2.2);
    glow = min(glow, abs(l - 0.55));
  }
  float fil = exp(-glow*7.0);
  vec3 c = grade(acc*0.30 + uBass*0.2) * (0.35 + acc*0.55);
  c += uColC * fil * (0.9 + uTreb*1.8);
  c += uColB * exp(-length(p)*1.4) * 0.5;
  return c * (0.9 + uEnergy*0.8 + uDown*0.3);
}

// 1 — CLOUD KINGDOM: lit rolling clouds with silver lining
vec3 scClouds(vec2 uv){
  vec2 p = uv*vec2(2.2,1.5);
  float t = uTime*0.045;
  vec2 sunDir = normalize(vec2(0.4, 0.75))*0.10;
  float base = fbm(p*1.4 + vec2(t*1.6, t*0.35));
  float wisp = fbm(p*3.6 + vec2(-t*2.4, t*0.7) + base*1.4);
  float d = base*0.7 + wisp*0.5 + uBass*0.20;
  // light: density difference toward the sun = scattering edge
  float dLit = fbm(p*1.4 + sunDir*2.0 + vec2(t*1.6, t*0.35))*0.7
             + fbm(p*3.6 + sunDir*2.0 + vec2(-t*2.4, t*0.7) + base*1.4)*0.5;
  float rim = clamp((d - dLit)*4.0, 0.0, 1.0);
  float sun = max(1.0 - length(uv - vec2(0.62, 0.72))*1.15, 0.0);
  vec3 sky = mix(uColA*0.55, uColB*0.7, uv.y);
  vec3 cloud = grade(d*0.8) * (0.55 + d*0.5);
  cloud += vec3(1.0,0.98,0.92) * rim * (0.8 + uMid*0.8);   // silver lining
  cloud += uColC * pow(sun,3.0)*0.9;
  float mask = smoothstep(0.32, 0.85, d);
  vec3 c = mix(sky, cloud, mask);
  c += uColC * pow(sun, 6.0) * (0.7 + uDown*1.0);
  return c * (0.9 + uEnergy*0.55);
}

// 2 — NEBULA STORM: raymarched volumetric gas — real depth, real light
vec3 scNebula(vec2 uv){
  vec2 q = (uv-0.5)*vec2(uRes.x/uRes.y,1.0);
  vec3 ro = vec3(0.0, 0.0, uTime*0.22);
  vec3 rd = normalize(vec3(q*1.15, 1.0));
  rd.xy *= rot(uTime*0.02);
  vec3 c = vec3(0.0);
  float trans = 1.0;
  for(int i=0;i<20;i++){
    vec3 pos = ro + rd*(0.5 + float(i)*0.17);
    float d = fbm3(pos*1.15) - 0.42 - uBass*0.06;
    if(d > 0.0){
      float dens = min(d*2.2, 1.0);
      vec3 em = grade(fbm3(pos*0.55 + 4.0)) * (0.4 + dens*1.1);
      c += em * dens * trans * 0.38;
      trans *= 1.0 - dens*0.34;
      if(trans < 0.05) break;
    }
  }
  // stars showing through the gas
  vec2 sp = uv*uRes*0.5;
  float star = step(0.9972, hash(floor(sp/2.0)));
  float tw = 0.5 + 0.5*sin(uTime*3.0 + hash(floor(sp/2.0))*40.0);
  c += vec3(star) * tw * trans * (0.7 + uTreb*1.5);
  c += uColC * uDown * 0.10;
  return c * (1.0 + uEnergy*0.7);
}

// 3 — PLASMA CORE: radial plasma
vec3 scPlasma(vec2 uv){
  vec2 p = uv - 0.5; p.x *= uRes.x/uRes.y;
  float r = length(p), a = atan(p.y,p.x);
  float w = sin(r*14.0 - uTime*2.2 + uBass*6.0)
          + sin(a*6.0 + uTime*1.1)
          + sin((r+a)*9.0 - uTime*1.6 + uMid*3.0);
  float f = w/3.0*0.5+0.5;
  vec3 c = grade(f + uBass*0.2);
  float core = smoothstep(0.34 + uBass*0.16, 0.0, r);
  c += uColC * core * (0.8 + uDown*1.2);
  c += uColB * pow(max(0.0,1.0-r*1.4),2.0)*0.4;
  return c * (0.7 + uEnergy*0.8);
}

// 4 — VORTEX TUNNEL: textured wormhole flythrough
vec3 scVortex(vec2 uv){
  vec2 p = uv - 0.5; p.x *= uRes.x/uRes.y;
  float r = length(p)+1e-4, a = atan(p.y,p.x);
  float z = 0.32/r + uTime*(1.9 + uBass*1.6);
  a += 0.20*sin(z*0.35 + uTime*0.25);                        // corkscrew twist
  float wall = fbm(vec2(a*3.0/3.14159, z*0.55));
  float ribs = pow(0.5+0.5*sin(z*2.2 - uTime*0.4), 3.0);
  float fog = smoothstep(0.02, 0.42, r);                     // depth fade to center
  vec3 c = grade(wall*0.85 + 0.1) * (0.25 + wall*1.5) * fog;
  c += uColC * ribs * fog * (0.6 + uTreb*1.3);
  c += uColB * exp(-r*7.0) * (1.6 + uDown*2.0);              // hot core light
  float speck = step(0.985, hash(vec2(floor(a*30.0), floor(z*4.0))));
  c += vec3(1.0) * speck * fog * (0.4 + uTreb*0.8);
  return c * (0.9 + uEnergy*0.7);
}

// 5 — LIQUID CHROME
vec3 scChrome(vec2 uv){
  vec2 p = uv*3.2; p *= rot(0.4 + uTime*0.03);
  float w = fbm(p + vec2(uTime*0.22, -uTime*0.14) + uBass*0.7);
  float n = fbm(p*2.1 - w*2.2 + uTime*0.1);
  float spec = pow(abs(sin(n*10.0 + w*6.0 - uTime*0.9)), 8.0);
  vec3 base = mix(uColA*0.35, uColB, n);
  vec3 c = base + vec3(0.95,0.97,1.0)*spec*(0.85 + uTreb*1.4);
  c += uColC * pow(w,3.0)*0.6;
  return c * (0.7 + uEnergy*0.7 + uDown*0.3);
}

// 6 — STARFALL WARP: radial streaks
vec3 scStarfall(vec2 uv){
  vec2 p = uv - 0.5; p.x *= uRes.x/uRes.y;
  float r = length(p)+1e-4, a = atan(p.y,p.x);
  float speed = 2.0 + uBass*4.0;
  float id = floor(a*40.0/6.28318);
  float rn = hash(vec2(id, 7.0));
  float streak = fract(r*2.2 - uTime*speed*(0.4+rn*0.8) - rn*9.0);
  float line = smoothstep(0.5, 0.0, abs(fract(a*40.0/6.28318)-0.5)*2.0);
  float tail = pow(streak, 5.0);
  vec3 c = grade(rn) * line * tail * (1.4 + uTreb*1.6);
  c += uColB * smoothstep(0.18, 0.0, r) * (0.9 + uDown*1.3);
  c *= smoothstep(0.02, 0.25, r);
  return c;
}

// 7 — GALAXY SPIRAL: rotating arms, dust, star specks
vec3 scGalaxy(vec2 uv){
  vec2 p = uv - 0.5; p.x *= uRes.x/uRes.y;
  p *= rot(uTime*0.05);
  float r = length(p)+1e-4, a = atan(p.y,p.x);
  float arm = sin(a*2.0 + log(r)*6.5 - uTime*0.35);
  float arms = smoothstep(0.15, 0.95, arm*0.5+0.5);
  float dust = fbm(p*4.0 + uTime*0.03);
  float disk = smoothstep(0.85, 0.05, r);
  vec3 c = grade(arms*0.7 + dust*0.4 + uBass*0.2) * arms * disk * (0.9 + dust);
  c += uColC * smoothstep(0.16 + uBass*0.05, 0.0, r) * (1.4 + uDown*1.6);
  vec2 sp = uv*uRes*0.5;
  float star = step(0.997, hash(floor(sp/2.0)));
  c += vec3(star) * (0.4+0.6*sin(uTime*4.0+hash(floor(sp/2.0))*30.0)) * disk * (0.7+uTreb*1.5);
  return c * (1.0 + uEnergy*0.8);
}

// 8 — DEEP SPACE: 3-layer parallax starfield + faint nebula
vec3 scDeepSpace(vec2 uv){
  vec3 c = grade(fbm(uv*2.2 + uTime*0.015)*0.5) * 0.30;
  for(int L=0; L<3; L++){
    float fl = float(L);
    float sc = 26.0 + fl*34.0;
    vec2 sp = uv*sc + vec2(uTime*(0.25+fl*0.45)*(0.4+uBass*0.8), fl*7.0);
    vec2 cell = floor(sp);
    vec2 f = fract(sp) - (vec2(hash(cell), hash(cell+7.0)));
    float d = length(f);
    float br = step(0.86 - fl*0.03, hash(cell+3.0));
    float tw = 0.5 + 0.5*sin(uTime*(2.0+fl*2.0) + hash(cell)*40.0);
    float s = smoothstep(0.10 + fl*0.03, 0.0, d);
    c += mix(vec3(1.0), uColC, fl*0.4) * s * br * tw * (0.9 + uTreb*1.6) * (1.0 - fl*0.2);
  }
  c += uColB * pow(fbm(uv*3.0 - uTime*0.02), 3.0) * (0.5 + uDown*0.7);
  return c * (0.95 + uEnergy*0.6);
}

// 9 — SUPERNOVA: hot core + expanding shock rings
vec3 scSupernova(vec2 uv){
  vec2 p = uv - 0.5; p.x *= uRes.x/uRes.y;
  float r = length(p)+1e-4;
  float n = fbm(p*5.0 + uTime*0.25);
  vec3 c = grade(n*0.6 + uBass*0.25) * smoothstep(1.0, 0.1, r) * 0.45;
  for(int i=0;i<3;i++){
    float ph = fract(uTime*0.16 + float(i)*0.333);
    float rr = ph*1.1;
    float ring = smoothstep(0.06, 0.0, abs(r-rr)) * (1.0-ph);
    c += grade(0.7+float(i)*0.1) * ring * (1.2 + uBass*1.5);
  }
  float core = smoothstep(0.30 + uBass*0.18, 0.0, r);
  c += uColC * core * (1.6 + uDown*2.2);
  c += vec3(1.0,0.98,0.9) * pow(core, 3.0) * (1.2 + uDown*1.5);
  float rays = pow(abs(sin(atan(p.y,p.x)*9.0 + uTime*0.4)), 6.0);
  c += uColB * rays * smoothstep(0.9, 0.1, r) * (0.35 + uTreb*0.9);
  return c;
}

// 10 — AURORA VEIL: drifting curtains
vec3 scAurora(vec2 uv){
  vec3 c = grade(0.06) * 0.35 * (1.0-uv.y);
  for(int i=0;i<3;i++){
    float fl = float(i);
    float x = uv.x*(2.2+fl*0.8) + uTime*(0.05+fl*0.04);
    float band = fbm(vec2(x, fl*5.0 + uTime*0.05));
    float y0 = 0.25 + band*0.5 + fl*0.06;
    float d = uv.y - y0;
    float curtain = smoothstep(0.0, 0.08, d) * smoothstep(0.55, 0.05, d);
    float shimmer = fbm(vec2(x*3.0, uv.y*6.0 - uTime*0.6));
    c += grade(0.35 + fl*0.22 + shimmer*0.25) * curtain * (0.75 + shimmer*0.8) * (0.8 + uMid*1.2);
  }
  vec2 sp = uv*uRes*0.5;
  float star = step(0.9982, hash(floor(sp/2.0)));
  c += vec3(star)*0.5*smoothstep(0.6,1.0,uv.y)*(0.6+uTreb);
  c += uColC * uDown * 0.12;
  return c * (0.95 + uEnergy*0.55);
}

// 11 — HEX PULSE: hex grid with radial energy waves
vec3 scHexPulse(vec2 uv){
  vec2 p = (uv-0.5); p.x *= uRes.x/uRes.y;
  float rr = length(p);
  vec2 h = p*9.0;
  vec2 r1 = vec2(1.0, 1.7320508);
  vec2 a1 = mod(h, r1) - r1*0.5;
  vec2 b1 = mod(h - r1*0.5, r1) - r1*0.5;
  vec2 g = dot(a1,a1) < dot(b1,b1) ? a1 : b1;
  float hex = max(abs(g.x)*0.8660254 + abs(g.y)*0.5, abs(g.y));
  float edge = smoothstep(0.5, 0.44, hex);
  float wave = sin(rr*16.0 - uTime*3.0 - uDown*4.0)*0.5+0.5;
  float wave2 = sin(rr*7.0 - uTime*1.2)*0.5+0.5;
  vec3 c = grade(wave*0.6 + rr*0.3) * edge * (0.35 + wave*wave2*(0.9 + uBass*1.6));
  c += uColC * (1.0-edge) * smoothstep(0.5,0.42,hex) * wave * (0.5 + uTreb*1.2);
  c += uColB * smoothstep(0.2+uBass*0.1, 0.0, rr) * (0.8 + uDown*1.4);
  return c * (0.9 + uEnergy*0.7);
}

// 12 — CATHEDRAL BEAMS: sweeping light shafts + rose glow
vec3 scCathedral(vec2 uv){
  vec2 src = vec2(0.5, 1.05);
  vec2 d = uv - src;
  float a = atan(d.x, -d.y);
  float beams = 0.0;
  for(int i=0;i<4;i++){
    float fl = float(i);
    float ba = sin(uTime*(0.12+fl*0.05) + fl*2.1) * 0.7;
    beams += pow(smoothstep(0.22, 0.0, abs(a-ba)), 2.0) * (0.5+0.5*sin(uTime*0.5+fl));
  }
  float dust = fbm(uv*5.0 + vec2(uTime*0.06, -uTime*0.10));
  vec3 c = grade(0.15 + dust*0.2) * 0.30;
  c += grade(0.75) * beams * (0.45 + dust*0.6) * (0.8 + uMid*1.1);
  float rose = smoothstep(0.30, 0.0, length(uv-vec2(0.5,0.68)));
  c += uColC * rose * beams * (0.3 + uDown*0.9);
  c += uColB * pow(1.0-uv.y, 3.0) * 0.15;
  return c * (0.95 + uEnergy*0.55);
}

// 13 — BLACK HOLE: lensed starfield, doppler disk, double photon ring
vec3 scBlackHole(vec2 uv){
  vec2 p = uv - 0.5; p.x *= uRes.x/uRes.y;
  float r = length(p)+1e-4;
  float swirl = 1.4/r;
  vec2 q = p * rot(swirl*0.35 + uTime*0.25);
  float a = atan(q.y,q.x);
  float disk = fbm(vec2(a*2.0 + uTime*0.4, r*9.0));
  float band = smoothstep(0.42, 0.16, r) * smoothstep(0.10, 0.17, r);
  float doppler = 0.65 + 0.55*sin(a + uTime*0.25);           // approaching side burns hotter
  vec3 c = grade(disk*0.8 + uBass*0.25) * band * (1.1 + disk*1.2 + uBass*1.2) * doppler;
  c += vec3(1.0,0.97,0.9) * band * pow(doppler,4.0) * 0.35;
  float horizon = smoothstep(0.115, 0.10, r);
  c *= 1.0 - horizon;
  float photon = smoothstep(0.013, 0.0, abs(r-0.118));
  float photon2 = smoothstep(0.006, 0.0, abs(r-0.104));
  c += uColC * photon * (2.2 + uDown*2.0);
  c += vec3(1.0) * photon2 * 1.2;
  // gravitationally lensed background stars — pulled toward the hole
  vec2 lensUv = uv + (p/r) * (-0.020/max(r,0.13));
  vec2 sp = lensUv*uRes*0.5;
  float star = step(0.996, hash(floor(sp/2.0)));
  float stretch = smoothstep(0.13, 0.30, r);
  c += vec3(star) * mix(0.2, 1.0, stretch) * (1.0-horizon) * (0.7 + uTreb*1.2);
  return c * (1.0 + uEnergy*0.6);
}

// 14 — KALEIDOSCOPE: 6-fold mirrored fractal bloom
vec3 scKaleido(vec2 uv){
  vec2 p = uv - 0.5; p.x *= uRes.x/uRes.y;
  float r = length(p), a = atan(p.y,p.x) + uTime*0.1;
  float seg = 3.14159/3.0;
  a = abs(mod(a, seg*2.0) - seg);
  vec2 q = vec2(cos(a), sin(a))*r*3.2;
  float f = fbm(q + uTime*0.15 + uBass*0.6);
  float g = fbm(q*2.2 - uTime*0.1 + f*1.5);
  vec3 c = grade(f*0.9 + g*0.4) * (0.6 + g*1.2);
  float veins = pow(1.0-abs(sin(f*10.0 - uTime*0.8)), 4.0);
  c += uColC * veins * (0.6 + uTreb*1.4);
  c += uColB * smoothstep(0.14+uBass*0.08, 0.0, r) * (1.0 + uDown*1.5);
  return c * (0.95 + uEnergy*0.75);
}

// 15 — LASER GRID: synthwave horizon, scrolling grid, striped sun
vec3 scLaserGrid(vec2 uv){
  float hz = 0.46;
  vec3 c = vec3(0.0);
  if(uv.y < hz){
    float d = hz - uv.y + 0.001;
    float persp = 0.06/d;
    float gx = abs(fract((uv.x-0.5)*persp*4.0)-0.5);
    float gz = abs(fract(persp*2.0 - uTime*(1.2 + uBass*1.5))-0.5);
    float lines = smoothstep(0.06,0.0,gx) + smoothstep(0.06,0.0,gz);
    c = grade(0.15) * 0.25 + uColB * lines * (0.7 + uBass*1.1) * smoothstep(0.0,0.12,d);
  } else {
    float sr = length((uv-vec2(0.5, hz+0.16))*vec2(uRes.x/uRes.y,1.0));
    float sun = smoothstep(0.15+uBass*0.03, 0.145+uBass*0.03, sr);
    float stripes = step(0.5, fract(uv.y*30.0 + uTime*0.3));
    float cut = mix(1.0, stripes, smoothstep(hz+0.16, hz+0.02, uv.y));
    c = mix(grade(0.1)*0.35, grade(0.85)*(1.3+uDown*0.8), sun*cut);
    vec2 sp = uv*uRes*0.5;
    float star = step(0.9975, hash(floor(sp/2.0)));
    c += vec3(star)*(1.0-sun)*(0.5+uTreb*1.2)*(0.4+0.6*sin(uTime*3.0+hash(floor(sp/2.0))*30.0));
  }
  float glow = smoothstep(0.10, 0.0, abs(uv.y-hz));
  c += uColC * glow * (0.5 + uBass*0.9);
  return c;
}

// 16 — PRISM SHARDS: voronoi facets flashing on the beat
vec3 scPrism(vec2 uv){
  vec2 p = uv*vec2(uRes.x/uRes.y,1.0)*5.0 + uTime*0.12;
  vec2 cell = floor(p);
  float md = 8.0; vec2 mid2 = vec2(0.0); float mi = 0.0;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    vec2 n = cell + vec2(float(x),float(y));
    vec2 pt = n + vec2(hash(n), hash(n+3.7));
    float d = length(p - pt);
    if(d < md){ md = d; mid2 = pt; mi = hash(n+9.1); }
  }
  float flash = 0.4 + 0.6*sin(mi*40.0 + uTime*(1.0+mi*2.0) + uDown*3.0);
  vec3 c = grade(mi) * flash * (0.55 + uEnergy*0.9);
  float edge = smoothstep(0.05, 0.0, abs(md - 0.35));
  c += uColC * edge * (0.5 + uTreb*1.3);
  c += uColC * smoothstep(0.08,0.0,md) * (0.7 + uBass*1.2);
  return c;
}

// 17 — FRACTAL DIVE: animated Julia set with orbit-trap glow
vec3 scFractalDive(vec2 uv){
  vec2 p = (uv-0.5)*vec2(uRes.x/uRes.y,1.0)*(2.7 - uBass*0.5);
  p *= rot(uTime*0.03);
  float t = uTime*0.10;
  vec2 cj = vec2(0.7885*cos(t), 0.7885*sin(t*1.31));
  vec2 z = p;
  float m = 0.0, trap = 1e9;
  for(int i=0;i<40;i++){
    z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + cj;
    trap = min(trap, abs(dot(z, vec2(0.707,0.707))));
    if(dot(z,z) > 16.0) break;
    m += 1.0;
  }
  float f = m/40.0;
  vec3 c = grade(f + uBass*0.2) * (0.30 + f*1.4);
  c += uColC * exp(-trap*3.5) * (0.7 + uTreb*1.6);
  c += uColB * exp(-trap*12.0) * (1.0 + uDown*1.2);
  return c;
}

// 18 — ION STORM: live lightning webs over a storm bed
vec3 scIonStorm(vec2 uv){
  vec3 c = grade(fbm(uv*3.0 + uTime*0.05)*0.45) * 0.30;
  c *= 0.6 + 0.4*(1.0-uv.y);
  for(int i=0;i<3;i++){
    float fi = float(i);
    float seedt = floor(uTime*(1.6+fi*0.7) + uDown*2.0);
    float xoff = (hash(vec2(seedt, fi)) - 0.5)*1.1;
    float path = 0.5 + xoff*0.5 + (fbm(vec2(uv.y*3.2 + seedt*7.0, fi*9.0)) - 0.5)*0.45;
    float d = abs(uv.x - path);
    float alive = step(0.35, hash(vec2(seedt, fi+5.0)));
    float flick = 0.4 + 0.6*step(0.3, hash(vec2(floor(uTime*24.0), fi)));
    float bolt = exp(-d*110.0);
    c += (vec3(0.85,0.9,1.0)*0.6 + uColC*0.6) * bolt * alive * flick * (0.9 + uMid*1.3);
    c += uColB * exp(-d*13.0) * 0.4 * alive * flick;
    // branch fork
    float bpath = path + (fbm(vec2(uv.y*6.0 + seedt*3.0, fi*4.0))-0.5)*0.25;
    float bd = abs(uv.x - bpath);
    c += uColC * exp(-bd*140.0) * alive * flick * smoothstep(0.2,0.6,uv.y) * 0.7;
  }
  c += grade(0.8) * uDown * 0.10;
  vec2 sp = uv*uRes*0.5;
  c += vec3(step(0.998, hash(floor(sp/2.0)))) * 0.3 * (0.5+uTreb);
  return c * (0.95 + uEnergy*0.6);
}

// 19 — LIQUID GOLD: molten metaball chrome with specular streaks
float lgField(vec2 p){
  float f = 0.0;
  for(int i=0;i<5;i++){
    float fi = float(i);
    vec2 c2 = vec2(sin(uTime*(0.30+fi*0.13)+fi*2.1), cos(uTime*(0.41+fi*0.09)+fi*1.7))
              * (0.42 + 0.10*sin(uTime*0.2+fi));
    f += (0.050 + uBass*0.02) / (dot(p-c2, p-c2) + 0.012);
  }
  return f;
}
vec3 scLiquidGold(vec2 uv){
  vec2 p = (uv-0.5)*vec2(uRes.x/uRes.y,1.0)*1.9;
  float f = lgField(p);
  float e = 0.012;
  vec2 g = vec2(lgField(p+vec2(e,0.0)) - lgField(p-vec2(e,0.0)),
                lgField(p+vec2(0.0,e)) - lgField(p-vec2(0.0,e)));
  vec3 n = normalize(vec3(-g, 0.35));
  float surf = smoothstep(1.0, 1.15, f);
  vec3 l = normalize(vec3(0.5, 0.8, 0.6));
  float diff = max(dot(n, l), 0.0);
  float spec = pow(max(dot(reflect(-l, n), vec3(0.0,0.0,1.0)), 0.0), 24.0);
  float fres = pow(1.0 - abs(n.z), 2.0);
  vec3 metal = grade(0.45 + n.y*0.35) * (0.35 + diff*0.9);
  metal += vec3(1.0,0.97,0.88) * spec * (1.6 + uTreb*1.6);
  metal += uColC * fres * 0.8;
  float edge = smoothstep(0.98, 1.02, f) * smoothstep(1.10, 1.04, f);
  vec3 c = metal * surf + uColB * edge * (1.2 + uDown*1.4);
  c += grade(0.12) * (1.0-surf) * 0.22;                      // dark backdrop sheen
  return c * (0.95 + uEnergy*0.6);
}

// 20 — GLYPH FOG: dim amethyst-gold fog bed for the 2D sacred-geometry lattice
vec3 scGlyphFog(vec2 uv){
  vec2 p = uv*2.4; p *= rot(uTime*0.015);
  float f = fbm(p + uTime*0.04);
  float g = fbm(p*1.7 - uTime*0.05 + f);
  vec2 cpv = uv-0.5; cpv.x *= uRes.x/uRes.y;
  float cd = length(cpv);
  vec3 c = grade(f*0.55 + 0.1) * (0.28 + g*0.4);
  c += uColB * smoothstep(0.7, 0.0, cd) * (0.12 + uBass*0.30);
  c += uColC * pow(g,4.0) * (0.25 + uDown*0.5);
  return c * (0.65 + uEnergy*0.4);
}


// ============================================================
// SACRED GEOMETRY BLOCK — scenes 21..28
// ============================================================

// 21 — METATRON CUBE: 13 circles of the Fruit of Life + all 78 connecting chords
vec3 scMetatron(vec2 uv){
  vec2 p = (uv-0.5)*vec2(uRes.x/uRes.y,1.0)*3.0;
  p *= rot(uTime*0.05);
  float R = 0.60 + 0.025*sin(uTime*0.45) + uBass*0.06;
  vec2 pts[13];
  pts[0] = vec2(0.0);
  for(int i=0;i<6;i++){
    float a = float(i)*1.0471975512 + 1.5707963268;
    vec2 d = vec2(cos(a), sin(a));
    pts[1+i] = d*R;
    pts[7+i] = d*R*2.0;
  }
  float lines=0.0, circles=0.0;
  float lw = 78.0 + uTreb*46.0;
  float cw = 20.0 + uMid*14.0;
  if(length(p) < R*2.0 + 1.25){
    for(int i=0;i<13;i++){
      circles += exp(-abs(length(p-pts[i]) - R)*cw);
      for(int j=0;j<13;j++){
        if(j<=i) continue;
        lines += exp(-sdSeg(p, pts[i], pts[j])*lw);
      }
    }
  }
  float halo = exp(-abs(length(p) - (R*2.0+0.30))*16.0);
  vec3 c = grade(0.10 + fbm(p*0.55 + uTime*0.03)*0.34) * 0.18;   // deep field
  c += uColB * lines   * (0.16 + uBeat*0.10);
  c += uColC * circles * (0.13 + uDown*0.12);
  c += grade(0.85) * pow(lines, 1.6) * 0.05;                     // hot chord crossings
  c += uColA * halo * (0.35 + uEnergy*0.5);
  c += uColC * exp(-length(p)*2.6) * (0.25 + uBass*0.7);         // core
  return c * (1.0 + uEnergy*0.8);
}

// 22 — FLOWER OF LIFE: triangular-lattice circle field, three parallax planes
float folLayer(vec2 p, float rad, float glow){
  const float rowH = 0.8660254;
  vec2 id = vec2(floor(p.x + 0.5), floor(p.y/rowH + 0.5));
  float g = 0.0;
  for(int j=-2;j<=2;j++){
    float jy = id.y + float(j);
    float off = mod(abs(jy), 2.0) > 0.5 ? 0.5 : 0.0;
    for(int i=-2;i<=2;i++){
      vec2 cc = vec2(id.x + float(i) + off, jy*rowH);
      g += exp(-abs(length(p-cc) - rad)*glow);
    }
  }
  return g;
}
vec3 scFlower(vec2 uv){
  vec2 q = (uv-0.5)*vec2(uRes.x/uRes.y,1.0);
  float t = uTime*0.05;
  vec3 c = grade(0.08 + fbm(q*1.6 + t)*0.30) * 0.20;
  float breathe = 1.0 + uBass*0.10;
  // far plane
  vec2 p1 = q*7.4*breathe; p1 *= rot(-t*0.6); p1 += vec2(t*0.5, -t*0.2);
  c += uColA * folLayer(p1, 1.0, 26.0) * 0.055;
  // mid plane
  vec2 p2 = q*4.6*breathe; p2 *= rot(t*0.9);
  c += uColB * folLayer(p2, 1.0, 30.0 + uTreb*20.0) * (0.075 + uMid*0.05);
  // near plane
  if(uQual > 0.5){
    vec2 p3 = q*2.7*breathe; p3 *= rot(-t*1.5);
    float g3 = folLayer(p3, 1.0, 34.0);
    c += uColC * g3 * (0.085 + uDown*0.09);
    c += grade(0.9) * pow(g3, 2.2) * 0.02;
  }
  c += uColC * exp(-length(q)*2.2) * (0.20 + uBass*0.55);
  return c * (0.95 + uEnergy*0.85);
}

// 23 — MERKABA: raymarched dual-tetrahedron star, glass shell + hot intersection edges
vec2 merkMap(vec3 p){
  vec3 q = rotY(uTime*0.30) * rotX(0.42 + sin(uTime*0.19)*0.32) * p;
  float s = 1.00 + uBass*0.10;
  float d1 = sdTetra(q, s);
  float d2 = sdTetra(q*vec3(1.0,-1.0,-1.0), s);
  float d = min(abs(d1)-0.015, abs(d2)-0.015);
  return vec2(d, abs(d1-d2));
}
vec3 scMerkaba(vec2 uv){
  vec2 q = (uv-0.5)*vec2(uRes.x/uRes.y,1.0);
  vec3 ro = vec3(0.0,0.0,-3.5);
  vec3 rd = normalize(vec3(q*1.25, 1.0));
  int steps = uQual>1.5 ? 90 : (uQual>0.5 ? 62 : 42);
  float tt = 0.0, hit = 0.0, ed = 1e9;
  vec3 glow = vec3(0.0);
  for(int i=0;i<90;i++){
    if(i>=steps) break;
    vec3 pp = ro + rd*tt;
    vec2 m = merkMap(pp);
    glow += grade(0.5 + 0.35*sin(tt*1.5 + uTime*0.8)) * exp(-max(m.x,0.0)*10.0) * 0.016;
    if(m.x < 0.0018){ hit = 1.0; ed = m.y; break; }
    tt += max(m.x*0.85, 0.0025);
    if(tt > 9.0) break;
  }
  vec3 c = glow * (0.85 + uEnergy*1.0);
  if(hit > 0.5){
    vec3 pp = ro + rd*tt;
    vec2 e = vec2(0.0014, 0.0);
    vec3 n = normalize(vec3(
      merkMap(pp+e.xyy).x - merkMap(pp-e.xyy).x,
      merkMap(pp+e.yxy).x - merkMap(pp-e.yxy).x,
      merkMap(pp+e.yyx).x - merkMap(pp-e.yyx).x));
    vec3 l = normalize(vec3(0.55, 0.80, -0.55));
    float dif = max(dot(n,l), 0.0);
    float fres = pow(1.0 - max(dot(n,-rd),0.0), 3.0);
    float spec = pow(max(dot(reflect(-l,n), -rd), 0.0), 42.0);
    c += grade(0.32 + dif*0.5) * (0.22 + dif*0.9);
    c += vec3(1.0,0.96,0.87) * spec * (1.5 + uTreb*1.9);
    c += uColC * fres * (1.0 + uDown*1.0);
    c += uColB * exp(-ed*24.0) * (1.7 + uBeat*1.3);
  } else {
    vec2 sp = uv*uRes*0.5;
    float star = step(0.9976, hash(floor(sp/2.0)));
    float tw = 0.5 + 0.5*sin(uTime*3.0 + hash(floor(sp/2.0))*40.0);
    c += vec3(star)*tw*(0.6 + uTreb*1.3);
  }
  return c * (0.95 + uEnergy*0.55);
}

// 24 — MENGER DIVE: infinite fractal-sponge corridor with iteration AO
float mengerMap(vec3 p){
  p.xy *= rot(p.z*0.05 + uTime*0.04);
  vec3 q = p;
  q.xy = mod(q.xy + 2.0, 4.0) - 2.0;
  float d = sdBox3(q, vec3(1.28));
  float s = 1.0;
  int it = uQual>1.5 ? 4 : 3;
  for(int m=0;m<4;m++){
    if(m>=it) break;
    vec3 a = mod(q*s, 2.0) - 1.0;
    s *= 3.0;
    vec3 r = abs(1.0 - 3.0*abs(a));
    float da = max(r.x,r.y), db = max(r.y,r.z), dc = max(r.z,r.x);
    d = max(d, (min(da,min(db,dc)) - 1.0)/s);
  }
  return d;
}
vec3 scMenger(vec2 uv){
  vec2 q = (uv-0.5)*vec2(uRes.x/uRes.y,1.0);
  vec3 ro = vec3(0.0, 0.0, uTime*(0.85 + uBass*0.9));
  vec3 rd = normalize(vec3(q*1.20, 1.0));
  rd.xy *= rot(sin(uTime*0.11)*0.22);
  int steps = uQual>1.5 ? 96 : (uQual>0.5 ? 66 : 46);
  float tt = 0.04, ao = 0.0, hit = 0.0;
  for(int i=0;i<96;i++){
    if(i>=steps) break;
    float d = mengerMap(ro + rd*tt);
    if(d < 0.0012*tt + 0.0007){ hit = 1.0; ao = 1.0 - float(i)/float(steps); break; }
    tt += d*0.90;
    if(tt > 14.0) break;
  }
  float fog = exp(-tt*0.17);
  vec3 c = grade(0.05 + fbm(uv*2.2 + uTime*0.03)*0.22) * 0.16;
  if(hit > 0.5){
    vec3 pp = ro + rd*tt;
    vec2 e = vec2(0.0016, 0.0);
    vec3 n = normalize(vec3(
      mengerMap(pp+e.xyy) - mengerMap(pp-e.xyy),
      mengerMap(pp+e.yxy) - mengerMap(pp-e.yxy),
      mengerMap(pp+e.yyx) - mengerMap(pp-e.yyx)));
    vec3 l = normalize(vec3(0.4, 0.7, -0.6));
    float dif = max(dot(n,l), 0.0);
    float rim = pow(1.0 - max(dot(n,-rd),0.0), 2.5);
    vec3 surf = grade(0.20 + ao*0.55 + dif*0.30) * (0.20 + dif*0.85) * (0.35 + ao*0.85);
    surf += uColC * rim * (0.55 + uTreb*1.1);
    surf += uColB * pow(ao, 3.0) * (0.5 + uDown*0.9);
    c = mix(c, surf, fog);
  }
  c += uColC * exp(-length(q)*3.2) * (0.18 + uBass*0.55);   // headlight
  return c * (1.0 + uEnergy*0.8);
}

// 25 — APOLLONIAN: inversive sphere-packing fractal, orbit-trap coloured
float apoMap(vec3 p, out float trap){
  float scale = 1.0;
  trap = 1e9;
  float s = 1.14 + 0.04*sin(uTime*0.11) + uBass*0.05;
  int it = uQual>1.5 ? 8 : (uQual>0.5 ? 6 : 5);
  for(int i=0;i<8;i++){
    if(i>=it) break;
    p = -1.0 + 2.0*fract(0.5*p + 0.5);
    float r2 = dot(p,p);
    trap = min(trap, r2);
    float k = s/max(r2, 1e-4);
    p *= k; scale *= k;
  }
  return 0.25*abs(p.y)/scale;
}
vec3 scApollonian(vec2 uv){
  vec2 q = (uv-0.5)*vec2(uRes.x/uRes.y,1.0);
  mat3 cam = rotY(uTime*0.09) * rotX(0.30*sin(uTime*0.06));
  vec3 ro = cam * vec3(0.0, 0.0, -2.1);
  vec3 rd = cam * normalize(vec3(q*1.2, 1.0));
  int steps = uQual>1.5 ? 110 : (uQual>0.5 ? 76 : 50);
  float tt = 0.0, hit = 0.0, trap = 1.0, tr = 1.0;
  vec3 glow = vec3(0.0);
  for(int i=0;i<110;i++){
    if(i>=steps) break;
    float d = apoMap(ro + rd*tt, tr);
    glow += grade(clamp(tr*2.2, 0.0, 1.0)) * exp(-max(d,0.0)*22.0) * 0.012;
    if(d < 0.0009){ hit = 1.0; trap = tr; break; }
    tt += d*0.72;
    if(tt > 6.0) break;
  }
  vec3 c = glow * (0.9 + uEnergy*0.9);
  if(hit > 0.5){
    vec3 pp = ro + rd*tt;
    vec2 e = vec2(0.0009, 0.0);
    float t0;
    vec3 n = normalize(vec3(
      apoMap(pp+e.xyy,t0) - apoMap(pp-e.xyy,t0),
      apoMap(pp+e.yxy,t0) - apoMap(pp-e.yxy,t0),
      apoMap(pp+e.yyx,t0) - apoMap(pp-e.yyx,t0)));
    vec3 l = normalize(vec3(0.6, 0.75, -0.4));
    float dif = max(dot(n,l), 0.0);
    float spec = pow(max(dot(reflect(-l,n), -rd), 0.0), 30.0);
    float fres = pow(1.0 - max(dot(n,-rd),0.0), 2.5);
    c += grade(clamp(trap*2.6 + 0.1, 0.0, 1.0)) * (0.22 + dif*0.95);
    c += vec3(1.0,0.97,0.9) * spec * (1.1 + uTreb*1.6);
    c += uColC * fres * (0.7 + uDown*0.9);
  }
  return c * (0.95 + uEnergy*0.7);
}

// 26 — HYPERCUBE 4D: tesseract under XW/YZ rotation, double-projected to screen
vec3 scHypercube(vec2 uv){
  vec2 p = (uv-0.5)*vec2(uRes.x/uRes.y,1.0)*2.2;
  float t = uTime*(0.85 + uBass*0.45);
  float c1=cos(t*0.31), s1=sin(t*0.31);
  float c2=cos(t*0.23), s2=sin(t*0.23);
  float c3=cos(t*0.19), s3=sin(t*0.19);
  vec2 pts[16];
  for(int i=0;i<16;i++){
    vec4 v = vec4(float(i & 1), float((i>>1) & 1), float((i>>2) & 1), float((i>>3) & 1))*2.0 - 1.0;
    vec4 q = vec4(v.x*c1 - v.w*s1, v.y, v.z, v.x*s1 + v.w*c1);   // XW plane
    q = vec4(q.x, q.y*c2 - q.z*s2, q.y*s2 + q.z*c2, q.w);        // YZ plane
    vec3 p3 = q.xyz * (2.2/(3.0 - q.w));                         // 4D -> 3D
    p3 = vec3(p3.x*c3 - p3.z*s3, p3.y, p3.x*s3 + p3.z*c3);
    pts[i] = p3.xy * (2.4/(3.0 - p3.z));                         // 3D -> 2D
  }
  float lines=0.0, verts=0.0;
  float lw = 86.0 + uTreb*44.0;
  for(int i=0;i<16;i++){
    verts += exp(-length(p - pts[i])*62.0);
    for(int b=0;b<4;b++){
      int j = i ^ (1<<b);
      if(j <= i) continue;
      lines += exp(-sdSeg(p, pts[i], pts[j])*lw);
    }
  }
  vec3 c = grade(0.06 + fbm(uv*2.6 + uTime*0.04)*0.26) * 0.16;
  c += uColB * lines * (0.24 + uBeat*0.14);
  c += grade(0.9) * pow(lines, 1.8) * 0.06;
  c += uColC * verts * (0.9 + uDown*1.2);
  c += uColA * exp(-length(p)*1.5) * 0.16;
  return c * (0.95 + uEnergy*0.9);
}

// 27 — QUASICRYSTAL: 7-fold plane-wave interference, aperiodic tiling
vec3 scQuasi(vec2 uv){
  vec2 p = (uv-0.5)*vec2(uRes.x/uRes.y,1.0)*11.0;
  p *= rot(uTime*0.025);
  float sum = 0.0;
  float k = 1.0 + uBass*0.30;
  for(int i=0;i<7;i++){
    float a = float(i)*0.4487989505;                 // pi/7
    sum += cos(dot(vec2(cos(a), sin(a)), p)*k + uTime*0.65 + float(i)*0.9);
  }
  float v = sum/7.0;
  float band = 1.0 - abs(fract(v*4.0 + uTime*0.05) - 0.5)*2.0;
  float edge = smoothstep(0.86, 1.0, band);
  vec3 c = grade(v*0.5 + 0.5) * (0.32 + band*0.55);
  c += uColC * pow(edge, 2.0) * (0.9 + uTreb*1.5);
  c += uColB * smoothstep(0.55, 1.0, v) * (0.35 + uDown*0.7);
  c *= 0.55 + 0.65*smoothstep(1.4, 0.15, length((uv-0.5)*vec2(uRes.x/uRes.y,1.0)));
  return c * (0.9 + uEnergy*0.85);
}

// 28 — TRUCHET WEAVE: beat-retiled arc lattice with bevel shading
float truchetD(vec2 p, float seed){
  vec2 id = floor(p);
  vec2 f = fract(p) - 0.5;
  if(hash(id + seed*7.31) > 0.5) f.x = -f.x;
  return abs(min(length(f - 0.5), length(f + 0.5)) - 0.5);
}
vec3 scTruchet(vec2 uv){
  vec2 q = (uv-0.5)*vec2(uRes.x/uRes.y,1.0);
  vec2 p = q*6.0;
  p *= rot(uTime*0.02);
  p += vec2(uTime*0.12, uTime*0.05);
  float seed = floor(uTime*0.22);
  float d = truchetD(p, seed);
  float w = 0.075 + uBass*0.035;
  float pipe = smoothstep(w + 0.028, w - 0.010, d);
  float e = 0.008;
  vec2 g = vec2(truchetD(p+vec2(e,0.0), seed) - truchetD(p-vec2(e,0.0), seed),
                truchetD(p+vec2(0.0,e), seed) - truchetD(p-vec2(0.0,e), seed));
  vec3 n = normalize(vec3(-g*7.0, 1.0));
  vec3 l = normalize(vec3(0.5, 0.7, 0.6));
  float dif = max(dot(n,l), 0.0);
  float spec = pow(max(dot(reflect(-l,n), vec3(0.0,0.0,1.0)), 0.0), 26.0);
  vec3 c = grade(0.06 + fbm(q*2.4 + uTime*0.05)*0.26) * 0.16;
  c += grade(0.30 + dif*0.45) * pipe * (0.30 + dif*0.95);
  c += vec3(1.0,0.97,0.9) * spec * pipe * (1.2 + uTreb*1.6);
  c += uColC * exp(-abs(d - w)*30.0) * (0.35 + uBeat*0.55);
  c += uColB * exp(-length(q)*2.4) * (0.16 + uDown*0.55);
  return c * (0.95 + uEnergy*0.8);
}

void main(){
  vec2 uv = vUv;
  vec3 c;
  if      (uScene==0)  c = scElectricSheep(uv);
  else if (uScene==1)  c = scClouds(uv);
  else if (uScene==2)  c = scNebula(uv);
  else if (uScene==3)  c = scPlasma(uv);
  else if (uScene==4)  c = scVortex(uv);
  else if (uScene==5)  c = scChrome(uv);
  else if (uScene==6)  c = scStarfall(uv);
  else if (uScene==7)  c = scGalaxy(uv);
  else if (uScene==8)  c = scDeepSpace(uv);
  else if (uScene==9)  c = scSupernova(uv);
  else if (uScene==10) c = scAurora(uv);
  else if (uScene==11) c = scHexPulse(uv);
  else if (uScene==12) c = scCathedral(uv);
  else if (uScene==13) c = scBlackHole(uv);
  else if (uScene==14) c = scKaleido(uv);
  else if (uScene==15) c = scLaserGrid(uv);
  else if (uScene==16) c = scPrism(uv);
  else if (uScene==17) c = scFractalDive(uv);
  else if (uScene==18) c = scIonStorm(uv);
  else if (uScene==19) c = scLiquidGold(uv);
  else if (uScene==20) c = scGlyphFog(uv);
  else if (uScene==21) c = scMetatron(uv);
  else if (uScene==22) c = scFlower(uv);
  else if (uScene==23) c = scMerkaba(uv);
  else if (uScene==24) c = scMenger(uv);
  else if (uScene==25) c = scApollonian(uv);
  else if (uScene==26) c = scHypercube(uv);
  else if (uScene==27) c = scQuasi(uv);
  else                 c = scTruchet(uv);
  c *= 1.22; // master visibility lift

  // feedback trails: sample previous frame slightly zoomed toward center
  vec2 tuv = (uv - 0.5) * (1.0 - 0.006 - uBass*0.010) + 0.5;
  vec3 prev = texture(uPrev, tuv).rgb;
  c = max(c, prev * uTrail);
  fragColor = vec4(min(c, vec3(uHdr)), 1.0);
}`;

// Bloom bright-pass: soft-knee highlight extraction
const BRIGHT_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uThresh, uKnee;
in vec2 vUv; out vec4 fragColor;
void main(){
  vec3 c = texture(uTex, vUv).rgb;
  c += texture(uTex, vUv + vec2( uTexel.x,  uTexel.y)).rgb;
  c += texture(uTex, vUv + vec2(-uTexel.x,  uTexel.y)).rgb;
  c += texture(uTex, vUv + vec2( uTexel.x, -uTexel.y)).rgb;
  c += texture(uTex, vUv + vec2(-uTexel.x, -uTexel.y)).rgb;
  c *= 0.2;
  float br = max(c.r, max(c.g, c.b));
  float soft = clamp(br - uThresh + uKnee, 0.0, 2.0*uKnee);
  soft = soft*soft / (4.0*uKnee + 1e-4);
  float w = max(soft, br - uThresh) / max(br, 1e-4);
  fragColor = vec4(c*w, 1.0);
}`;

// 13-tap downsample (stable under motion, no fireflies)
const DOWN_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uTexel;
in vec2 vUv; out vec4 fragColor;
void main(){
  vec2 t = uTexel;
  vec3 a = texture(uTex, vUv + vec2(-2.0*t.x,  2.0*t.y)).rgb;
  vec3 b = texture(uTex, vUv + vec2( 0.0,      2.0*t.y)).rgb;
  vec3 c = texture(uTex, vUv + vec2( 2.0*t.x,  2.0*t.y)).rgb;
  vec3 d = texture(uTex, vUv + vec2(-2.0*t.x,  0.0)).rgb;
  vec3 e = texture(uTex, vUv).rgb;
  vec3 f = texture(uTex, vUv + vec2( 2.0*t.x,  0.0)).rgb;
  vec3 g = texture(uTex, vUv + vec2(-2.0*t.x, -2.0*t.y)).rgb;
  vec3 h = texture(uTex, vUv + vec2( 0.0,     -2.0*t.y)).rgb;
  vec3 i = texture(uTex, vUv + vec2( 2.0*t.x, -2.0*t.y)).rgb;
  vec3 j = texture(uTex, vUv + vec2(-t.x,  t.y)).rgb;
  vec3 k = texture(uTex, vUv + vec2( t.x,  t.y)).rgb;
  vec3 l = texture(uTex, vUv + vec2(-t.x, -t.y)).rgb;
  vec3 m = texture(uTex, vUv + vec2( t.x, -t.y)).rgb;
  vec3 o = e*0.125;
  o += (a+c+g+i)*0.03125;
  o += (b+d+f+h)*0.0625;
  o += (j+k+l+m)*0.125;
  fragColor = vec4(o, 1.0);
}`;

// 9-tap tent upsample, blended additively back down the chain
const UP_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uAmt;
in vec2 vUv; out vec4 fragColor;
void main(){
  vec2 t = uTexel;
  vec3 s  = texture(uTex, vUv + vec2(-t.x,  t.y)).rgb;
  s += texture(uTex, vUv + vec2( 0.0,  t.y)).rgb * 2.0;
  s += texture(uTex, vUv + vec2( t.x,  t.y)).rgb;
  s += texture(uTex, vUv + vec2(-t.x,  0.0)).rgb * 2.0;
  s += texture(uTex, vUv).rgb * 4.0;
  s += texture(uTex, vUv + vec2( t.x,  0.0)).rgb * 2.0;
  s += texture(uTex, vUv + vec2(-t.x, -t.y)).rgb;
  s += texture(uTex, vUv + vec2( 0.0, -t.y)).rgb * 2.0;
  s += texture(uTex, vUv + vec2( t.x, -t.y)).rgb;
  fragColor = vec4(s * 0.0625 * uAmt, 1.0);
}`;

// Final composite: sharpen, bloom, anamorphic streak, ACES, vignette, grain, dither
const FINAL_FRAG = `#version 300 es
precision highp float;
uniform sampler2D uTex;      // HDR scene
uniform sampler2D uBloom;    // bloom chain, mip 0
uniform vec2 uRes;           // output (canvas) resolution
uniform vec2 uSrcTexel;      // 1 / internal render size
uniform float uTimeG, uBeat, uDown, uAber;
uniform float uBloomAmt, uSharp, uGrain, uExpo;
in vec2 vUv; out vec4 fragColor;
float hash(vec2 p){
  vec3 q = fract(vec3(p.xyx)*0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
vec3 aces(vec3 x){
  return clamp((x*(2.51*x + 0.03)) / (x*(2.43*x + 0.59) + 0.14), 0.0, 1.0);
}
void main(){
  vec2 uv = vUv;
  // downbeat camera punch — tiny seeded kick, decays with the pulse
  uv += (vec2(hash(vec2(uTimeG,1.0)), hash(vec2(uTimeG,7.0))) - 0.5) * uDown * 0.006;
  vec2 d = (uv - 0.5) * (0.0026 + uAber*0.004 + uDown*0.004);
  vec3 c = vec3(texture(uTex, uv + d).r, texture(uTex, uv).g, texture(uTex, uv - d).b);
  // unsharp mask against the render-scale upsample — restores edge bite at 4K
  if(uSharp > 0.001){
    vec2 t = uSrcTexel;
    vec3 b = texture(uTex, uv + vec2( t.x, 0.0)).rgb
           + texture(uTex, uv + vec2(-t.x, 0.0)).rgb
           + texture(uTex, uv + vec2( 0.0, t.y)).rgb
           + texture(uTex, uv + vec2( 0.0,-t.y)).rgb;
    c += (c - b*0.25) * uSharp;
  }
  // bloom + horizontal anamorphic streak
  vec3 bl = texture(uBloom, uv).rgb;
  vec3 streak = vec3(0.0);
  for(int i=1;i<=4;i++){
    float o = float(i)*0.007;
    streak += texture(uBloom, uv + vec2( o, 0.0)).rgb;
    streak += texture(uBloom, uv + vec2(-o, 0.0)).rgb;
  }
  c += bl * uBloomAmt;
  c += streak * 0.05 * uBloomAmt * vec3(0.72, 0.86, 1.18);
  // filmic pipeline: exposure -> ACES tonemap -> vibrance
  c = aces(c * uExpo);
  float lum = dot(c, vec3(0.299, 0.587, 0.114));
  c = mix(vec3(lum), c, 1.24);
  float hot = max(max(c.r,c.g),c.b);
  c += vec3(hot) * 0.08 * smoothstep(0.75, 1.2, hot);
  float vig = smoothstep(1.35, 0.30, length((uv-0.5)*vec2(uRes.x/uRes.y,1.0)*1.28));
  c *= mix(0.84, 1.0, vig);
  c += (hash(uv*uRes + uTimeG) - 0.5) * uGrain;
  c += vec3(uDown*0.05);
  // dither before the 8-bit write — no banding across big gradients
  c += (hash(uv*uRes*1.37 + 11.0) - 0.5) / 255.0;
  fragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;
