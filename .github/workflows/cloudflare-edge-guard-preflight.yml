name: Cloudflare Edge Guard Delivery

on:
  push:
    branches:
      - main
    paths:
      - cloudflare/glyphlock-edge-guard/**
      - .github/workflows/cloudflare-edge-guard-preflight.yml
  pull_request:
    branches:
      - main
    paths:
      - cloudflare/glyphlock-edge-guard/**
      - .github/workflows/cloudflare-edge-guard-preflight.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy only after the trusted inventory reports SAFE TO DEPLOY
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-edge-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate edge guard without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/glyphlock-edge-guard/package-lock.json

      - name: Install pinned Worker toolchain
        working-directory: cloudflare/glyphlock-edge-guard
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate source, tests, and dry-run bundle
        working-directory: cloudflare/glyphlock-edge-guard
        run: |
          node --check src/index.js
          node --check scripts/preflight.mjs
          node --check scripts/route-pattern.mjs
          node --check scripts/verify-live.mjs
          node --check scripts/rollback.mjs
          npm test
          npm run deploy -- --dry-run

  preflight:
    name: Inventory glyphlock.io from trusted main
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production-preflight
    outputs:
      account_id: ${{ steps.inventory.outputs.account_id }}
      zone_id: ${{ steps.inventory.outputs.zone_id }}
      safe_to_deploy: ${{ steps.inventory.outputs.safe_to_deploy }}
      fresh_deploy: ${{ steps.inventory.outputs.fresh_deploy }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify protected inventory source
        working-directory: cloudflare/glyphlock-edge-guard
        run: |
          echo "b9ad6cd8a8e1b9b6e24fc09b1a7ac7269ccc15df011f81c6f9edc7498a63c04b  scripts/preflight.mjs" | sha256sum -c -
          echo "27c0f182125333a69bc35e9ad216ca84a305f4ec4f34c6824cf60e428f76abfa  scripts/route-pattern.mjs" | sha256sum -c -

      - name: Inventory Cloudflare account and zone
        id: inventory
        working-directory: cloudflare/glyphlock-edge-guard
        env:
          CLOUDFLARE_INVENTORY_DIR: ${{ runner.temp }}/cloudflare-inventory
        run: node scripts/preflight.mjs

      - name: Upload sanitized inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyphlock-cloudflare-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/cloudflare-inventory/cloudflare-preflight-inventory.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy, verify, and roll back on failure
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.safe_to_deploy == 'true' &&
      needs.preflight.outputs.fresh_deploy == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-production-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.preflight.outputs.account_id }}
      CLOUDFLARE_ZONE_ID: ${{ needs.preflight.outputs.zone_id }}

    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/glyphlock-edge-guard/package-lock.json

      - name: Verify protected delivery source
        working-directory: cloudflare/glyphlock-edge-guard
        run: |
          echo "a6f211de31e256d242d0dd8279c13700bac85c2b914df9faab4f195ddea584b4  src/index.js" | sha256sum -c -
          echo "5a8a33eade369bb8bc4e7a95b6ce007dd68c5df3dc9061818afaf4dd46f7c931  scripts/verify-live.mjs" | sha256sum -c -
          echo "0e1f7e17849e945858806fd284c1c69dc7414835b0be53479055ade6025c38f8  scripts/rollback.mjs" | sha256sum -c -

      - name: Install pinned Wrangler
        working-directory: cloudflare/glyphlock-edge-guard
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reconfirm collision-free Cloudflare state
        working-directory: cloudflare/glyphlock-edge-guard
        env:
          CLOUDFLARE_INVENTORY_DIR: ${{ runner.temp }}/cloudflare-recheck
        run: node scripts/preflight.mjs

      - name: Deploy exact edge guard Worker and route
        id: deploy
        continue-on-error: true
        working-directory: cloudflare/glyphlock-edge-guard
        run: timeout --foreground --signal=TERM --kill-after=30s 5m npm run deploy

      - name: Verify public and protected live routes
        id: verify-live
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        working-directory: cloudflare/glyphlock-edge-guard
        run: node scripts/verify-live.mjs

      - name: Roll back exact route and script after failed delivery
        id: rollback
        if: always() && (steps.deploy.outcome != 'success' || steps.verify-live.outcome != 'success')
        working-directory: cloudflare/glyphlock-edge-guard
        run: node scripts/rollback.mjs

      - name: Mark failed delivery after rollback attempt
        if: always() && (steps.deploy.outcome != 'success' || steps.verify-live.outcome != 'success')
        run: |
          echo 'Cloudflare edge guard delivery failed. Exact-scope rollback was attempted; inspect the rollback summary.'
          exit 1

      - name: Record successful delivery
        if: steps.deploy.outcome == 'success' && steps.verify-live.outcome == 'success'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Cloudflare edge guard delivery

          **Result: PASS**

          The exact `glyphlock-edge-guard` Worker is active on `glyphlock.io/*`. Public traffic remains available, recognized crawlers receive HTTP 404 on protected routes, and protected browser responses receive noindex/no-store headers.

          No DNS record, SSL/TLS mode, cache rule, Page Rule, ruleset, Base44 setting, NUPS workflow, or crawler-prerender fallback was changed.
          SUMMARY
