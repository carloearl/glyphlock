name: Cloudflare Edge Guard Preflight

on:
  push:
    branches:
      - main
    paths:
      - cloudflare/glyphlock-edge-guard/**
      - .github/workflows/cloudflare-edge-guard-preflight.yml
  pull_request:
    branches:
      - main
    paths:
      - cloudflare/glyphlock-edge-guard/**
      - .github/workflows/cloudflare-edge-guard-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-edge-guard-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate edge guard without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Validate Worker and route inventory logic
        working-directory: cloudflare/glyphlock-edge-guard
        run: |
          node --check src/index.js
          node --check scripts/preflight.mjs
          node --check scripts/route-pattern.mjs
          node --test

  preflight:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    name: Inventory glyphlock.io before mutation
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production-preflight
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Verify protected inventory source
        working-directory: cloudflare/glyphlock-edge-guard
        run: |
          echo "25b973194385a7287e00b5615496f33ca4da503f65f7c6ea7ff79e9840a90190  scripts/preflight.mjs" | sha256sum -c -
          echo "3263a9eb1fed287cb4af6169e43ae46b42a7e6eed53328a5f9d82a65d01526f4  scripts/route-pattern.mjs" | sha256sum -c -

      - name: Inventory Cloudflare account and zone
        id: inventory
        working-directory: cloudflare/glyphlock-edge-guard
        env:
          CLOUDFLARE_INVENTORY_DIR: ${{ runner.temp }}/cloudflare-inventory
        run: node scripts/preflight.mjs

      - name: Upload sanitized inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyphlock-cloudflare-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/cloudflare-inventory/cloudflare-preflight-inventory.json
          if-no-files-found: warn
          retention-days: 14
