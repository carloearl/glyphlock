name: NUPS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nups-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Block tracked environments and secrets
        run: npm run check:secrets

      - name: Install locked dependencies
        run: npm ci

      - name: Audit Base44 entity model
        run: npm run audit:entities

      - name: Verify NUPS DJ function SDK pins
        run: npm run check:dj-functions

      - name: Lint
        run: npm run lint

      - name: Type-check JavaScript and JSX
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Upload entity audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base44-entity-audit
          path: artifacts/entity-audit/
          if-no-files-found: warn
          retention-days: 30
