# GitHub-admin managed workflow.
# Base44 agents must add CI checks through .base44/ci-checks.json and npm scripts,
# because the Base44 GitHub App does not have workflows: write permission.
name: NUPS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nups-ci-${{ github.ref }}
  # Superseded PR checks may be cancelled. Main delivery runs are never
  # cancelled mid-deployment, preserving live verification and rollback.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Block tracked environments and secrets
        run: npm run check:secrets

      - name: Install locked dependencies
        run: npm ci

      - name: Audit Base44 entity model
        run: npm run audit:entities

      - name: Enforce Tier 2 write-gateway cutoff
        run: npm run check:nups-write-gateway

      - name: Run Base44-managed CI checks
        run: npm run ci:base44

      - name: Verify NUPS DJ function SDK pins
        run: npm run check:dj-functions

      - name: Verify integration security boundaries
        run: npm run check:integrations

      - name: Verify NUPS mode and venue isolation guards
        run: npm run check:nups-isolation

      - name: Audit required NUPS operational UI
        run: npm run audit:nups-ui

      - name: Lint
        run: npm run lint

      - name: Type-check JavaScript and JSX
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Upload entity audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base44-entity-audit
          path: artifacts/entity-audit/
          if-no-files-found: warn
          retention-days: 30

  cloudflare-static:
    name: Verify Cloudflare edge guard without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      delivery_required: ${{ steps.changes.outputs.delivery_required }}

    steps:
      - name: Checkout complete comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect edge-guard delivery changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed_file_list="$(mktemp)"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' 'cloudflare/glyphlock-edge-guard/manual-dispatch' > "$changed_file_list"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA...HEAD" > "$changed_file_list"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$changed_file_list"
          else
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > "$changed_file_list"
          fi

          if grep -Eq '^(cloudflare/glyphlock-edge-guard/|\.github/workflows/(nups-ci\.yml|cloudflare-edge-guard-preflight\.yml)$)' "$changed_file_list"; then
            echo 'delivery_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'delivery_required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 22
        if: steps.changes.outputs.delivery_required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker, preflight, live verification, rollback, and unit tests
        if: steps.changes.outputs.delivery_required == 'true'
        working-directory: cloudflare/glyphlock-edge-guard
        run: |
          node --check src/index.js
          node --check scripts/preflight.mjs
          node --check scripts/verify-live.mjs
          node --check scripts/rollback.mjs
          node --test

  cloudflare-preflight:
    name: Inventory glyphlock.io before mutation
    needs:
      - verify
      - cloudflare-static
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.cloudflare-static.result == 'success' &&
      needs.cloudflare-static.outputs.delivery_required == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      account_id: ${{ steps.inventory.outputs.account_id }}
      zone_id: ${{ steps.inventory.outputs.zone_id }}
      safe_to_deploy: ${{ steps.inventory.outputs.safe_to_deploy }}
      fresh_deploy: ${{ steps.inventory.outputs.fresh_deploy }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_INVENTORY_DIR: ${{ runner.temp }}/cloudflare-inventory

    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inventory Cloudflare account and zone
        id: inventory
        working-directory: cloudflare/glyphlock-edge-guard
        run: node scripts/preflight.mjs

      - name: Upload sanitized inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyphlock-cloudflare-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/cloudflare-inventory/cloudflare-preflight-inventory.json
          if-no-files-found: warn
          retention-days: 14

  cloudflare-deploy:
    name: Deploy and verify Cloudflare edge guard
    needs: cloudflare-preflight
    if: >-
      always() &&
      needs.cloudflare-preflight.result == 'success' &&
      needs.cloudflare-preflight.outputs.safe_to_deploy == 'true' &&
      needs.cloudflare-preflight.outputs.fresh_deploy == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.cloudflare-preflight.outputs.account_id }}
      CLOUDFLARE_ZONE_ID: ${{ needs.cloudflare-preflight.outputs.zone_id }}

    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-run Worker unit tests immediately before deployment
        working-directory: cloudflare/glyphlock-edge-guard
        run: node --test

      - name: Deploy exact edge guard Worker and route
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          accountId: ${{ needs.cloudflare-preflight.outputs.account_id }}
          wranglerVersion: '4.121.0'
          workingDirectory: cloudflare/glyphlock-edge-guard
          command: deploy

      - name: Verify public and protected live routes
        id: verify-live
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        working-directory: cloudflare/glyphlock-edge-guard
        run: node scripts/verify-live.mjs

      - name: Roll back exact route and script after any failed delivery gate
        id: rollback
        if: always() && (steps.deploy.outcome != 'success' || steps.verify-live.outcome != 'success')
        working-directory: cloudflare/glyphlock-edge-guard
        run: node scripts/rollback.mjs

      - name: Mark failed delivery after rollback
        if: always() && (steps.deploy.outcome != 'success' || steps.verify-live.outcome != 'success')
        run: |
          echo 'Cloudflare edge guard delivery failed and the exact route/script rollback was attempted.'
          exit 1

      - name: Record successful delivery
        if: steps.deploy.outcome == 'success' && steps.verify-live.outcome == 'success'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Cloudflare edge guard delivery

          **Result: PASS**

          The exact `glyphlock-edge-guard` Worker is active on `glyphlock.io/*`. Public traffic remains available, crawler requests to protected paths return HTTP 404, and protected browser responses receive noindex/no-store headers.

          No DNS record, SSL/TLS mode, cache rule, Page Rule, ruleset, Base44 authentication setting, or crawler-prerender fallback was changed.
          SUMMARY
